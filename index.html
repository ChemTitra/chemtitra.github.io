    <script>
        // Suppress informational in-browser Babel transformer warnings across warn/error/info
        (function() {
            var shouldIgnoreBabelNote = function(arg) {
                return arg && typeof arg === 'string' && (arg.indexOf('in-browser Babel transformer') !== -1 || arg.indexOf('[BABEL] Note:') !== -1);
            };
            var originalWarn = console.warn;
            var originalError = console.error;
            console.warn = function() {
                if (shouldIgnoreBabelNote(arguments[0])) return;
                return originalWarn.apply(console, arguments);
            };
            console.error = function() {
                if (shouldIgnoreBabelNote(arguments[0])) return;
                return originalError.apply(console, arguments);
            };
        })();

        // Typography Formatter for KSSM Quiz Strings: Converts Unicode Subscripts/Superscripts, Underscore Subscripts & Chemical Symbols into Native Plus Jakarta Sans Elements
        const SUB_CHAR_MAP = { '₀':'0', '₁':'1', '₂':'2', '₃':'3', '₄':'4', '₅':'5', '₆':'6', '₇':'7', '₈':'8', '₉':'9', 'ₐ':'a', 'ₑ':'e', 'ₒ':'o', 'ₓ':'x', 'ₙ':'n', '₊':'+', '₋':'−' };
        const SUP_CHAR_MAP = { '⁰':'0', '¹':'1', '²':'2', '³':'3', '⁴':'4', '⁵':'5', '⁶':'6', '⁷':'7', '⁸':'8', '⁹':'9', '⁺':'+', '⁻':'−' };

        const formatChemText = (input) => {
            if (input === null || input === undefined) return input;
            if (typeof input !== 'string') return input;

            // Normalize E_reactants, E_products, E_peak, E°_cell, CₙH₂ₙ₊₂, ≡, ⇌, →, Δ, θ alongside Unicode sub/superscripts
            const tokenRegex = /(²⁷₁₃Al|[₀₁₂₃₄₅₆₇₈₉ₐₑₒₓₙ₊₋]+(?:'?)|[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+|_[a-zA-Z0-9]+|→|⇌|≡|Δ|θ)/g;
            const parts = input.split(tokenRegex);
            if (parts.length === 1) return input;

            return parts.map((part, idx) => {
                if (!part) return null;
                if (part === '²⁷₁₃Al') {
                    return (
                        <span key={idx} className="inline-flex items-center font-sans tabular-nums">
                            <span className="inline-flex flex-col text-[0.68em] leading-[1.05] text-right mr-0.5 font-bold">
                                <span>27</span>
                                <span>13</span>
                            </span>
                            <span>Al</span>
                        </span>
                    );
                }
                if (part.startsWith('_')) {
                    return <sub key={idx} className="font-sans">{part.slice(1)}</sub>;
                }
                const firstChar = part[0];
                if (SUB_CHAR_MAP[firstChar]) {
                    const hasPrime = part.endsWith("'");
                    const rawSub = hasPrime ? part.slice(0, -1) : part;
                    const mapped = rawSub.split('').map(c => SUB_CHAR_MAP[c] || c).join('');
                    return (
                        <React.Fragment key={idx}>
                            <sub className="font-sans">{mapped}</sub>
                            {hasPrime ? "'" : null}
                        </React.Fragment>
                    );
                }
                if (SUP_CHAR_MAP[firstChar]) {
                    const mapped = part.split('').map(c => SUP_CHAR_MAP[c] || c).join('');
                    return <sup key={idx} className="font-sans">{mapped}</sup>;
                }
                if (part === '⇌') {
                    return (
                        <svg key={idx} viewBox="0 0 20 12" className="inline-block w-[1.2em] h-[0.78em] mx-1 align-middle select-none" aria-label="reversible reaction">
                            <line x1="1.5" y1="3.8" x2="18" y2="3.8" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" />
                            <polyline points="14,1.2 18.2,3.8" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
                            <line x1="2" y1="8.2" x2="18.5" y2="8.2" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" />
                            <polyline points="6,10.8 1.8,8.2" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
                        </svg>
                    );
                }
                if (part === '≡') {
                    return (
                        <svg key={idx} viewBox="0 0 12 10" className="inline-block w-[0.78em] h-[0.68em] mx-[1px] align-middle select-none" style={{ transform: 'translateY(-0.05em)' }} aria-label="triple bond">

            if (driveFileMatch && driveFileMatch[1]) { return `https://drive.google.com/file/d/${driveFileMatch[1]}/preview`; }
            const driveIdMatch = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
            if (driveIdMatch && driveIdMatch[1]) { return `https://drive.google.com/file/d/${driveIdMatch[1]}/preview`; }

            useEffect(() => {
                const canvas = document.getElementById('bg-canvas');
                if (!canvas) return;
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (prefersReducedMotion) return;

                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let isPaused = document.hidden;
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const handleResize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                window.addEventListener('resize', handleResize);

                const handleVisibility = () => {
                    isPaused = document.hidden;
                    if (!isPaused) { animationFrameId = requestAnimationFrame(render); }
                };
                document.addEventListener('visibilitychange', handleVisibility);

                const numParticles = Math.min(80, Math.floor((width * height) / 24000));
                const particles = [];
                const colors = theme === 'dark' 
                    ? ['#14b8a6', '#38bdf8', '#818cf8', '#2dd4bf', '#60a5fa']
                    : theme === 'eyecare'
                    ? ['#0f766e', '#0284c7', '#4338ca', '#0d9488', '#1e40af']
                    : ['#0d9488', '#0284c7', '#6366f1', '#14b8a6', '#0284c7'];

                for (let i = 0; i < numParticles; i++) {
                    particles.push({
                        x: Math.random() * width, y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                        radius: Math.random() * 2 + 1,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    const strokeAlpha = theme === 'dark' ? 0.22 : theme === 'eyecare' ? 0.16 : 0.25;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = theme === 'dark'
                                    ? `rgba(100, 116, 139, ${strokeAlpha * (1 - dist / 120)})`
                                    : `rgba(148, 163, 184, ${strokeAlpha * (1 - dist / 120)})`;
                                ctx.lineWidth = 0.75;
                                ctx.stroke();
                            }
                        }
                    }

                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    });

                    if (!isPaused) { animationFrameId = requestAnimationFrame(render); }
                };

                render();
                return () => {
                    window.removeEventListener('resize', handleResize);
                    document.removeEventListener('visibilitychange', handleVisibility);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [theme]);
            return null;

        const AnimatedNumber = ({ value, duration = 650, suffix = '', prefix = '' }) => {
            const [displayVal, setDisplayVal] = useState(value);
            const prevValRef = useRef(value);

            useEffect(() => {
                const startVal = Number(prevValRef.current) || 0;
                const endVal = Number(value) || 0;
                prevValRef.current = endVal;
                if (startVal === endVal) {
                    setDisplayVal(endVal);
                    return;
                }
                let rafId;
                const startTime = performance.now();
                const step = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const current = Math.round(startVal + (endVal - startVal) * eased);
                    setDisplayVal(current);
                    if (progress < 1) {
                        rafId = requestAnimationFrame(step);
                    } else {
                        setDisplayVal(endVal);
                    }
                };
                rafId = requestAnimationFrame(step);
                return () => cancelAnimationFrame(rafId);
            }, [value, duration]);

            return <span className="tabular-nums">{prefix}{displayVal}{suffix}</span>;
        };

        const BentoMasteryGauge = ({ percentage = 0, completed = 0, total = 0, theme = 'light', formLabel = 'Form 4' }) => {

            const circumference = Math.PI * radius; // Semi-circle arc length
            const strokeDashoffset = circumference - (clamped / 100) * circumference;

            return (
                <div className="flex flex-col items-center justify-center select-none">
                    <div className="relative w-36 h-20 flex items-end justify-center overflow-visible">
                        <svg viewBox="0 0 140 80" className="w-full h-full overflow-visible">
                            <defs>
                                <linearGradient id="chemtitraGaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stopColor="#0d9488" />
                                    <stop offset="100%" stopColor="#10b981" />
                                </linearGradient>
                            </defs>
                            {/* Track Arc */}
                            <path
                                d="M 14 70 A 56 56 0 0 1 126 70"
                                fill="none"
                                stroke={theme === 'dark' ? '#1e293b' : '#e6ebe4'}
                                strokeWidth="11"
                                strokeLinecap="round"
                            />
                            {/* Progress Arc */}
                            <path
                                d="M 14 70 A 56 56 0 0 1 126 70"

                                stroke="url(#chemtitraGaugeGrad)"
                                strokeWidth="11"

                                strokeDasharray={circumference}

                            <span className={`text-xl sm:text-2xl font-extrabold tracking-normal leading-none tabular-nums ${
                                theme === 'dark' ? 'text-white' : 'text-[#141a16]'
                            }`}>
                                <AnimatedNumber value={clamped} suffix="%" />
                            </span>
                            <span className={`text-[10px] font-semibold mt-0.5 ${
                                theme === 'dark' ? 'text-slate-400' : 'text-slate-500'
                            }`}>
                                {formLabel} Mastery
                            </span>
                        </div>
                    </div>
                </div>
            );
        };

        // Circular radial clip-path wipe when toggling Light / Dark theme
        const switchThemeWithRadialWipe = (nextTheme, currentTheme, evt, setThemeFn) => {
            if (nextTheme === currentTheme) return;
            const applyTheme = () => {
                setThemeFn(nextTheme);
                try {
                    localStorage.setItem('chemtitra_theme', nextTheme);
                } catch (e) {}
            };

            const prefersReduced = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (typeof document === 'undefined' || !document.startViewTransition || prefersReduced) {
                applyTheme();
                return;
            }

            let x = window.innerWidth - 120;
            let y = 36;
            if (evt && evt.currentTarget && evt.currentTarget.getBoundingClientRect) {
                const rect = evt.currentTarget.getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top + rect.height / 2;
            } else if (evt && typeof evt.clientX === 'number' && evt.clientX > 0) {
                x = evt.clientX;
                y = evt.clientY;
            }

            const endRadius = Math.hypot(
                Math.max(x, window.innerWidth - x),
                Math.max(y, window.innerHeight - y)
            );

            try {
                const transition = document.startViewTransition(() => {
                    ReactDOM.flushSync(() => {
                        applyTheme();
                    });
                });

                transition.ready.then(() => {
                    document.documentElement.animate(
                        {
                            clipPath: [
                                `circle(0px at ${x}px ${y}px)`,
                                `circle(${endRadius}px at ${x}px ${y}px)`
                            ]
                        },
                        {
                            duration: 460,
                            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
                            pseudoElement: '::view-transition-new(root)'
                        }
                    );
                }).catch(() => {});
            } catch (e) {
                applyTheme();
            }
        };

        Object.assign(window, {
            portalToBody,
            AUTHORIZED_OWNER_EMAILS,
            isAuthorizedOwnerEmail,
            PERMANENT_AVATAR_URL,
            FALLBACK_AVATAR,
            FIREBASE_CONFIG,
            INITIAL_MATERIALS,
            curriculumData,
            SUB_CHAR_MAP,
            SUP_CHAR_MAP,
            formatChemText,
            renderQuizDiagram,
            getChapterQuizQuestions,
            ELEMENTS,
            CATEGORY_STYLES,
            formatEmbedUrl,
            isRecentlyUploaded,
            MolecularCanvas,
            FormulaGuideModal,
            AnimatedNumber,
            BentoMasteryGauge,
            switchThemeWithRadialWipe
        });
    </script>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const {
            portalToBody,
            AUTHORIZED_OWNER_EMAILS,
            isAuthorizedOwnerEmail,
            PERMANENT_AVATAR_URL,
            FALLBACK_AVATAR,
            FIREBASE_CONFIG,
            INITIAL_MATERIALS,
            curriculumData,
            SUB_CHAR_MAP,
            SUP_CHAR_MAP,
            formatChemText,
            renderQuizDiagram,
            getChapterQuizQuestions,
            ELEMENTS,
            CATEGORY_STYLES,
            formatEmbedUrl,
            isRecentlyUploaded,
            MolecularCanvas,
            FormulaGuideModal,
            AnimatedNumber,
            BentoMasteryGauge,
            switchThemeWithRadialWipe
        } = window;

        function App() {
            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem('chemtitra_theme');
                    return saved === 'dark' ? 'dark' : 'light';
                } catch (e) {
                    return 'light';
                }
            });
            const [activeSubject, setActiveSubject] = useState('chemistry');
            const [selectedForm, setSelectedForm] = useState('Form 4');
            const [selectedCategory, setSelectedCategory] = useState('Notes'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('newest');
            const [filterLanguage, setFilterLanguage] = useState('ALL');

            // Quick Bookmark / Favorite Feature (Pillars 1, 3 & 4)
            const [favorites, setFavorites] = useState(() => {
                try {
                    const saved = localStorage.getItem('chemtitra_favorites');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [showFavoritesOnly, setShowFavoritesOnly] = useState(false);
            const searchInputRef = useRef(null);

            const [mobileBioExpanded, setMobileBioExpanded] = useState(false);
            const [showPeriodicTable, setShowPeriodicTable] = useState(false);
            const [selectedElement, setSelectedElement] = useState(null);
            const [ptCategoryFilter, setPtCategoryFilter] = useState('ALL');
            const [showInstructorModal, setShowInstructorModal] = useState(false);
            const [instructorModalTab, setInstructorModalTab] = useState('about'); // 'about' | 'tips' | 'expertise'
            const [showFormulaGuide, setShowFormulaGuide] = useState(false);
            const [formulaActiveTab, setFormulaActiveTab] = useState('formulas'); // 'formulas' | 'solubility' | 'ions' | 'tests'
            const [formulaSearchQuery, setFormulaSearchQuery] = useState('');
            const [ptSearchQuery, setPtSearchQuery] = useState('');
            const [readerExpanded, setReaderExpanded] = useState(false);
            const [activeQuickQuiz, setActiveQuickQuiz] = useState(null);
            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });

            // Draggable Floating AI Chatbot Button (Freely movable everywhere on screen)
            const [chatBtnPos, setChatBtnPos] = useState(() => {
                try {
                    const saved = localStorage.getItem('chemtitra_ai_btn_pos');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (typeof parsed?.x === 'number' && typeof parsed?.y === 'number') {
                            return parsed;
                        }
                    }
                } catch (e) {}
                return null;
            });
            const [isDraggingChatBtn, setIsDraggingChatBtn] = useState(false);
            const chatBtnWrapperRef = useRef(null);
            const chatBtnDragRef = useRef({
                isDown: false,
                hasMoved: false,
                startX: 0,
                startY: 0,
                initialLeft: 0,
                initialTop: 0,
                btnWidth: 60,
                btnHeight: 60
            });

            // Keep button inside screen bounds on window resize/orientation change
            useEffect(() => {
                const handleResize = () => {
                    setChatBtnPos(prev => {
                        if (!prev) return null;
                        const btnSize = window.innerWidth < 640 ? 56 : 64;
                        const pad = 10;
                        const maxX = Math.max(pad, window.innerWidth - btnSize - pad);
                        const maxY = Math.max(pad, window.innerHeight - btnSize - pad);
                        return {
                            x: Math.min(Math.max(pad, prev.x), maxX),
                            y: Math.min(Math.max(pad, prev.y), maxY)
                        };
                    });
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const handleChatBtnPointerDown = (e) => {
                if (e.button !== undefined && e.button !== 0) return;
                
                const wrapper = chatBtnWrapperRef.current;
                const rect = wrapper ? wrapper.getBoundingClientRect() : null;
                const btnWidth = rect ? rect.width : (window.innerWidth < 640 ? 56 : 64);
                const btnHeight = rect ? rect.height : (window.innerWidth < 640 ? 56 : 64);
                const currentLeft = rect ? rect.left : (chatBtnPos ? chatBtnPos.x : window.innerWidth - btnWidth - 20);
                const currentTop = rect ? rect.top : (chatBtnPos ? chatBtnPos.y : window.innerHeight - btnHeight - 24);
                const touchStartTime = Date.now();

                chatBtnDragRef.current = {
                    isDown: true,
                    hasMoved: false,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialLeft: currentLeft,
                    initialTop: currentTop,
                    btnWidth,
                    btnHeight,
                    startTime: touchStartTime
                };

                const onPointerMove = (moveEvt) => {
                    const drag = chatBtnDragRef.current;
                    if (!drag.isDown) return;

                    const dx = moveEvt.clientX - drag.startX;
                    const dy = moveEvt.clientY - drag.startY;

                    // Standard touch slop: only start drag when movement exceeds 10px
                    if (!drag.hasMoved) {
                        if (Math.hypot(dx, dy) < 10) return;
                        drag.hasMoved = true;
                        setIsDraggingChatBtn(true);
                    }

                    const pad = 8;
                    const newX = drag.initialLeft + dx;
                    const newY = drag.initialTop + dy;
                    const minX = pad;
                    const maxX = Math.max(minX, window.innerWidth - drag.btnWidth - pad);
                    const minY = pad;
                    const maxY = Math.max(minY, window.innerHeight - drag.btnHeight - pad);

                    const clampedX = Math.min(Math.max(minX, newX), maxX);
                    const clampedY = Math.min(Math.max(minY, newY), maxY);

                    setChatBtnPos({ x: clampedX, y: clampedY });
                };

                const onPointerUp = () => {
                    const drag = chatBtnDragRef.current;
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                    window.removeEventListener('pointercancel', onPointerUp);

                    if (!drag.isDown) return;
                    drag.isDown = false;

                    const elapsed = Date.now() - (drag.startTime || 0);

                    // If it was a quick tap (< 280ms) or movement stayed below slop, treat as tap
                    if (!drag.hasMoved || elapsed < 280) {
                        setIsDraggingChatBtn(false);
                        setShowAiChat(true);
                        return;
                    }

                    setTimeout(() => {
                        setIsDraggingChatBtn(false);
                    }, 50);
                    // Save last position in localStorage
                    setChatBtnPos(curr => {
                        if (curr) {
                            try {
                                localStorage.setItem('chemtitra_ai_btn_pos', JSON.stringify(curr));
                            } catch (err) {}
                        }
                        return curr;
                    });
                };

                window.addEventListener('pointermove', onPointerMove, { passive: false });
                window.addEventListener('pointerup', onPointerUp);
                window.addEventListener('pointercancel', onPointerUp);
            };

            const showToast = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast(prev => ({ ...prev, show: false })), 4000);
            };

            const toggleFavorite = (id, title, e) => {
                if (e) e.stopPropagation();
                if (favorites.includes(id)) {
                    const next = favorites.filter(favId => favId !== id);
                    setFavorites(next);
                    localStorage.setItem('chemtitra_favorites', JSON.stringify(next));
                    showToast(`Removed "${title || 'Material'}" from saved revision bookmarks.`, 'info');
                } else {
                    const next = [...favorites, id];
                    setFavorites(next);
                    localStorage.setItem('chemtitra_favorites', JSON.stringify(next));
                    showToast(`⭐ Saved "${title || 'Material'}" to revision bookmarks!`, 'success');
                }
            };

            // Coordinated Modal Openers (Prevents Cluttered Stacking)
            const openPeriodicTable = () => {
                setShowPeriodicTable(true);
                setShowAiChat(false);
                setShowInstructorModal(false);
                setShowFormulaGuide(false);
            };
            const openFormulaGuide = () => {
                setShowFormulaGuide(true);
                setShowPeriodicTable(false);
                setShowAiChat(false);
                setShowInstructorModal(false);
            };
            const openInstructorBio = () => {
                setInstructorModalTab('about');
                setShowInstructorModal(true);
                setShowPeriodicTable(false);
                setShowAiChat(false);
                setShowFormulaGuide(false);
            };
            const openAiAssistant = () => {
                setShowAiChat(true);
                setShowPeriodicTable(false);
                setShowInstructorModal(false);
                setShowFormulaGuide(false);
            };

            // --- AI LEARNING ASSISTANT CHAT STATE ---
            const [showAiChat, setShowAiChat] = useState(false);
            const [chatModel, setChatModel] = useState('gemini-3.6-flash');
            const [chatInput, setChatInput] = useState('');
            const [chatLoading, setChatLoading] = useState(false);
            const [chatError, setChatError] = useState('');
            const chatMessagesEndRef = useRef(null);
            const chatInputRef = useRef(null);
            const lastChatQueryRef = useRef('');

            const INITIAL_CHAT_MESSAGES = [
                {
                    id: 'welcome',
                    role: 'assistant',
                    content: "Hello, I am the official AI learning assistant for Ikmal Hafiz Education Workspace.\nWhat concept or topics would you like to explore together?",
                    timestamp: 'Just now'
                }
            ];

            const [chatMessages, setChatMessages] = useState(() => {
                const saved = localStorage.getItem('chemtitra_ai_chat_history_v3');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    } catch (e) {}
                }
                return INITIAL_CHAT_MESSAGES;
            });

            useEffect(() => {
                localStorage.setItem('chemtitra_ai_chat_history_v3', JSON.stringify(chatMessages));
                if (showAiChat && chatMessagesEndRef.current) {
                    chatMessagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [chatMessages, showAiChat]);

            const handleClearChat = () => {
                setChatMessages(INITIAL_CHAT_MESSAGES);
                localStorage.removeItem('chemtitra_ai_chat_history_v3');
                setChatError('');
            };

            // Global Keyboard Navigation & Escape Key Dismissal (Pillars 1 & 2)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        if (selectedElement) setSelectedElement(null);
                        else if (activeQuickQuiz) setActiveQuickQuiz(null);
                        else if (showFormulaGuide) setShowFormulaGuide(false);
                        else if (showPeriodicTable) setShowPeriodicTable(false);
                        else if (showAiChat) setShowAiChat(false);
                        else if (showInstructorModal) setShowInstructorModal(false);
                        else if (activePdfItem) { setActivePdfItem(null); setReaderExpanded(false); }
                        else if (showMaterialModal) setShowMaterialModal(false);
                        else if (itemToDelete) setItemToDelete(null);
                        else if (showOwnerModal) setShowOwnerModal(false);
                        else if (showAvatarUrlModal) setShowAvatarUrlModal(false);
                        else if (isEditingAnnouncement) setIsEditingAnnouncement(false);
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        if (searchInputRef.current) {
                            searchInputRef.current.focus();
                            searchInputRef.current.select();
                        }
                    }
                    if (e.key === '/' && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        if (searchInputRef.current) {
                            searchInputRef.current.focus();
                            searchInputRef.current.select();
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedElement, activeQuickQuiz, showFormulaGuide, showPeriodicTable, showAiChat, showInstructorModal, activePdfItem, showMaterialModal, itemToDelete, showOwnerModal, showAvatarUrlModal, isEditingAnnouncement]);

            const SUB_MAP = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉', '+': '₊', '-': '₋' };
            const SUP_MAP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '+': '⁺', '-': '⁻' };

            const cleanChemicalSymbols = (raw) => {
                if (!raw) return '';
                let s = raw;
                // Unwrap LaTeX text/ce/pu/mathrm blocks: \text{H2O} -> H2O
                s = s.replace(/\\(?:text|mathrm|mathbf|ce|pu|mathit)\{([^}]+)\}/g, '$1');
                // Common LaTeX arrow and symbol commands
                s = s.replace(/\\(?:longrightarrow|rightarrow|to)\b/g, '→');
                s = s.replace(/\\(?:longleftarrow|leftarrow)\b/g, '←');
                s = s.replace(/\\(?:rightleftharpoons|leftrightharpoons)\b/g, '⇌');
                s = s.replace(/\\Delta\b/g, 'Δ');
                s = s.replace(/\\times\b/g, '×');
                s = s.replace(/\\cdot\b/g, '•');
                s = s.replace(/\\approx\b/g, '≈');
                s = s.replace(/\\pm\b/g, '±');
                s = s.replace(/\\circ\b/g, '°');
                s = s.replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1 / $2)');
                // Strip LaTeX spacers and formatting tags
                s = s.replace(/\\(?:quad|qquad|;|!|,|\s)/g, ' ');
                // Strip LaTeX math wrapper delimiters $ ... $, $$ ... $$, \( ... \), \[ ... \]
                s = s.replace(/\$\$([\s\S]*?)\$\$/g, '$1');
                s = s.replace(/\$([^\$]+)\$/g, '$1');
                s = s.replace(/\\\(([\s\S]*?)\\\)/g, '$1');
                s = s.replace(/\\\[([\s\S]*?)\\\]/g, '$1');
                // Convert subscript patterns: _{2} or _2
                s = s.replace(/_\{([0-9+\-]+)\}/g, (_, chars) => chars.split('').map(c => SUB_MAP[c] || c).join(''));
                s = s.replace(/_([0-9])/g, (_, digit) => SUB_MAP[digit] || digit);
                // Convert superscript patterns: ^{2+} or ^2+
                s = s.replace(/\^\{([0-9+\-]+)\}/g, (_, chars) => chars.split('').map(c => SUP_MAP[c] || c).join(''));
                s = s.replace(/\^([0-9+\-])/g, (_, char) => SUP_MAP[char] || char);
                // Remove stray backslashes before words
                s = s.replace(/\\([a-zA-Z]+)/g, '$1');
                return s;
            };

            const renderElectronConfigJSX = (raw) => {
                if (!raw) return null;
                const UN_SUP_MAP = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9' };
                const tokens = raw.trim().split(/\s+/);
                return tokens.map((token, idx) => {
                    const match = token.match(/^(\d+[spdfSPDF])([0-9⁰¹²³⁴⁵⁶⁷⁸⁹]+)$/);
                    if (match) {
                        const powerNum = Array.from(match[2]).map(ch => UN_SUP_MAP[ch] || ch).join('');
                        return (
                            <span key={idx} className="inline-flex items-baseline whitespace-nowrap font-sans tabular-nums">
                                <span>{match[1]}</span>
                                <sup className="font-extrabold ml-0.5 select-all">{powerNum}</sup>
                            </span>
                        );
                    }
                    return (
                        <span key={idx} className="inline-block whitespace-nowrap opacity-90">
                            {token}
                        </span>
                    );
                });
            };

            const handleSendChatMessage = async (textToSend = null) => {
                const rawQuery = (typeof textToSend === 'string' ? textToSend : (chatInput || lastChatQueryRef.current)).trim();
                if (!rawQuery || chatLoading) return;
                lastChatQueryRef.current = rawQuery;
                const query = cleanChemicalSymbols(rawQuery);

                const userMsg = {
                    id: 'user-' + Date.now(),
                    role: 'user',
                    content: query,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                const updatedMessages = [...chatMessages, userMsg];
                setChatMessages(updatedMessages);
                if (!textToSend) setChatInput('');
                setChatLoading(true);
                setChatError('');

                // Send the last 10 messages to keep the session lean, fast and reliable
                const recentHistory = updatedMessages.slice(-10).map(m => ({ role: m.role, content: m.content }));

                const sendRequest = async () => {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 35000);

                    try {
                        const response = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            signal: controller.signal,
                            body: JSON.stringify({
                                messages: recentHistory,
                                model: chatModel,
                                currentContext: {
                                    form: selectedForm,
                                    subject: getSubjectForForm(selectedForm),
                                    category: selectedCategory
                                }
                            })
                        });

                        clearTimeout(timeoutId);

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(errData.error || `Server responded with status ${response.status}`);
                        }
                        return await response.json();
                    } catch (fetchErr) {
                        clearTimeout(timeoutId);
                        if (fetchErr.name === 'AbortError') {
                            throw new Error("Connection took longer than expected. Tap Retry to continue.");
                        }
                        throw fetchErr;
                    }
                };

                try {
                    let data;
                    try {
                        data = await sendRequest();
                    } catch (firstErr) {
                        await new Promise(r => setTimeout(r, 600));
                        data = await sendRequest();
                    }

                    const assistantMsg = {
                        id: 'assistant-' + Date.now(),
                        role: 'assistant',
                        content: cleanChemicalSymbols(data.reply || "I am here to guide you. Could you rephrase your question?"),
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };

                    setChatMessages(prev => [...prev, assistantMsg]);
                } catch (err) {
                    setChatError(err.message || "Failed to receive tutor response. Tap Retry to try again.");
                } finally {
                    setChatLoading(false);
                }
            };

            const renderFormattedMessage = (content) => {
                if (!content) return null;
                const cleanedContent = cleanChemicalSymbols(content);
                const lines = cleanedContent.split('\n');
                return lines.map((line, lIdx) => {
                    const trimmed = line.trim();
                    if (!trimmed) {
                        return <div key={lIdx} className="h-2"></div>;
                    }
                    if (/^(\*{3,}|-{3,}|_{3,})$/.test(trimmed)) {
                        return <hr key={lIdx} className="my-2.5 border-slate-200 dark:border-slate-700/80" />;
                    }

                    if (trimmed.startsWith('#### ')) {
                        return (
                            <h5 key={lIdx} className="font-extrabold text-xs text-teal-600 dark:text-cyan-300 mt-2 mb-0.5">
                                {trimmed.replace(/^####\s+/, '').replace(/\*\*/g, '')}
                            </h5>
                        );
                    }
                    if (trimmed.startsWith('### ')) {
                        return (
                            <h4 key={lIdx} className="font-extrabold text-xs sm:text-sm text-teal-600 dark:text-cyan-300 mt-2.5 mb-1">
                                {trimmed.replace(/^###\s+/, '').replace(/\*\*/g, '')}
                            </h4>
                        );
                    }
                    if (trimmed.startsWith('## ') || trimmed.startsWith('# ')) {
                        return (
                            <h3 key={lIdx} className="font-black text-sm sm:text-base text-teal-700 dark:text-cyan-200 mt-3 mb-1">
                                {trimmed.replace(/^#{1,2}\s+/, '').replace(/\*\*/g, '')}
                            </h3>
                        );
                    }

                    const isBullet = trimmed.startsWith('- ') || trimmed.startsWith('* ') || trimmed.startsWith('• ');
                    const isNumbered = /^\d+[\.\)]\s/.test(trimmed);

                    const parts = lineText.split(/(\*\*.*?\*\*|`.*?`)/g);
                    const formattedLine = parts.map((part, pIdx) => {
                        if (part.startsWith('**') && part.endsWith('**')) {
                            return <strong key={pIdx} className="font-extrabold text-teal-600 dark:text-cyan-300">{formatChemText(part.slice(2, -2))}</strong>;
                        }
                        if (part.startsWith('`') && part.endsWith('`')) {
                            return <code key={pIdx} className="px-1.5 py-0.5 rounded bg-teal-500/10 dark:bg-teal-900/30 text-teal-700 dark:text-teal-300 font-sans tabular-nums text-[11px] sm:text-xs font-bold">{formatChemText(part.slice(1, -1))}</code>;
                        }
                        return formatChemText(part);
                    });

                            <div key={lIdx} className="flex items-start space-x-2 my-1">
                                <span className="text-teal-500 font-black text-xs mt-0.5">•</span>
                                <span className="flex-1 text-xs sm:text-sm leading-relaxed">{formattedLine}</span>
                            </div>
                        );
                    }
                    if (isNumbered) {
                        const num = trimmed.match(/^(\d+)\./)?.[1] || '1';
                        return (
                            <div key={lIdx} className="flex items-start space-x-2 my-1.5">
                                <span className="w-5 h-5 rounded-md bg-teal-500/10 text-teal-600 dark:text-teal-400 font-bold text-[10px] flex items-center justify-center flex-shrink-0 mt-0.5">{num}</span>
                                <span className="flex-1 text-xs sm:text-sm leading-relaxed">{formattedLine}</span>
                            </div>
                        );
                    }
                    return (
                        <p key={lIdx} className="text-xs sm:text-sm leading-relaxed my-0.5">

                        </p>
                    );
                });

            const handleSaveMaterial = async (e) => {
                e.preventDefault();
                if (!formData.title || !formData.fileUrl) return showToast('Please enter both the title and document URL.', 'error');

                const formattedUrl = formData.category === 'Quiz' ? formData.fileUrl.trim() : formatEmbedUrl(formData.fileUrl);
                const tagsArray = formData.tags 
                    ? formData.tags.split(',').map(t => t.trim().replace(/^#/, '')).filter(t => t && !t.toUpperCase().includes('KSSM')) 
                    : [];

                let cleanTitle = formData.title.trim();
                cleanTitle = cleanTitle.replace(/\s*[•\-–]\s*Comprehensive Study Notes/gi, ' • Study Notes');
                cleanTitle = cleanTitle.replace(/Comprehensive Study Notes/gi, 'Study Notes');

                const newItemData = {
                    form: formData.form,
                    subject: getSubjectForForm(formData.form),
                    category: formData.category,
                    chapter: formData.chapter.trim() || 'General Topic',
                    title: cleanTitle,
                    description: formData.description,
                    fileUrl: formattedUrl,
                    rawUrl: formData.fileUrl,
                    language: formData.language || 'DLP',
                    views: editingItem ? (editingItem.views || 0) : 0,
                    updatedAt: new Date().toISOString().split('T')[0],
                    tags: tagsArray
                };

                try {
                    if (db && window.FirebaseModule) {
                        const { doc, setDoc, addDoc, collection } = window.FirebaseModule;
                        if (editingItem) {
                            const docRef = doc(db, 'chemtitra_materials', editingItem.id);
                            await setDoc(docRef, newItemData, { merge: true });
                        } else {
                            const colRef = collection(db, 'chemtitra_materials');
                            await addDoc(colRef, newItemData);
                        }
                    } else {
                        if (editingItem) {
                            setMaterials(prev => prev.map(m => m.id === editingItem.id ? { ...m, ...newItemData } : m));
                        } else {
                            const id = 'mat-' + Date.now();
                            setMaterials(prev => [{ id, ...newItemData }, ...prev]);
                        }
                    }

                    showToast(editingItem ? '🎉 Success! Material updated successfully!' : '🎉 Success! Material published successfully!', 'success');
                    setShowMaterialModal(false);
                    
                    setFormData({
                        form: formData.form,
                        subject: getSubjectForForm(formData.form),
                        category: formData.category,
                        chapter: '',
                        title: '',
                        description: '',
                        fileUrl: '',
                        language: formData.language,
                        tags: ''
                    });

                } catch (err) {
                    if (editingItem) {
                        setMaterials(prev => prev.map(m => m.id === editingItem.id ? { ...m, ...newItemData } : m));
                    } else {
                        const id = 'mat-' + Date.now();
                        setMaterials(prev => [{ id, ...newItemData }, ...prev]);
                    }

                    showToast('🎉 Success! Saved to local storage.', 'success');
                    setShowMaterialModal(false);
                    
                    setFormData({
                        form: formData.form,
                        subject: getSubjectForForm(formData.form),
                        category: formData.category,
                        chapter: '',
                        title: '',
                        description: '',
                        fileUrl: '',
                        language: formData.language,
                        tags: ''
                    });
                }
            };

            const confirmDeleteMaterial = async () => {
                if (!itemToDelete) return;
                
                const material = itemToDelete;
                
                if (!material.id) { 
                    console.error("Missing document ID"); 
                    setMaterials(prev => prev.filter(m => m !== material));
                    setItemToDelete(null);
                    return; 
                }
                
                setMaterials(prev => {
                    const updated = prev.filter(m => m.id !== material.id);
                    localStorage.setItem('chemtitra_materials_cache', JSON.stringify(updated));
                    return updated;
                });

                try {
                    if (db && window.FirebaseModule) {
                        const { doc, deleteDoc } = window.FirebaseModule;
                        await deleteDoc(doc(db, "chemtitra_materials", material.id));

                        (item.description && item.description.toLowerCase().includes(query)) ||
                        (item.tags && item.tags.some(t => t.toLowerCase().includes(query)));
                    return matchesForm && matchesCategory && matchesLang && matchesFav && matchesSearch;
                });

                list.sort((a, b) => {
                    if (sortBy === 'newest') return (b.updatedAt || '').localeCompare(a.updatedAt || '');
                    else if (sortBy === 'oldest') return (a.updatedAt || '').localeCompare(b.updatedAt || '');
                    else if (sortBy === 'chapter') return (a.chapter || '').localeCompare(b.chapter || '');
                    else if (sortBy === 'views') return (b.views || 0) - (a.views || 0);
                    return 0;
                });

                return list;

                                    ].map((item, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleSendChatMessage(item.q)}
                                            disabled={chatLoading}
                                            className={`px-2.5 py-1 rounded-xl text-[11px] font-bold whitespace-nowrap border transition-all active:scale-95 disabled:opacity-50 flex-shrink-0 cursor-pointer ${
                                                theme === 'dark'
                                                    ? 'bg-slate-800/90 hover:bg-slate-700 text-teal-300 border-slate-700'
                                                    : 'bg-white hover:bg-teal-50 text-teal-800 border-teal-200 shadow-xs'
                                            }`}
                                        >
                                            {item.label}
                                        </button>
                                    ))}
                                </div>

                                {/* Chat Input Box */}
                                <div className={`p-3 sm:p-4 border-t pb-[max(0.85rem,env(safe-area-inset-bottom))] ${
                                    theme === 'dark' ? 'bg-slate-950/80 border-slate-800' : 'bg-white border-slate-200'
                                }`}>
                                    {/* Quick Chemical & Science Symbols Toolbar */}
                                    <div className="flex items-center space-x-1.5 mb-2 overflow-x-auto pb-1 text-[11px] touch-pan-x">
                                        <span className="text-[10px] font-bold text-slate-400 mr-1 flex items-center gap-1 flex-shrink-0">
                                            <i className="fa-solid fa-atom text-teal-500"></i> Symbols:
                                        </span>
                                        {['→', '⇌', '⁺', '⁻', '²⁺', '³⁺', '₂', '₃', '₄', '₅', '₆', 'Δ', '°C', '•'].map((sym) => (
                                            <button
                                                key={sym}
                                                type="button"
                                                onMouseDown={(e) => e.preventDefault()}
                                                onClick={() => {
                                                    setChatInput(prev => prev + sym);
                                                    chatInputRef.current?.focus();
                                                }}
                                                className={`px-2 py-0.5 rounded-lg font-bold text-xs border transition-all active:scale-90 flex-shrink-0 cursor-pointer ${
                                                    theme === 'dark'
                                                        ? 'bg-slate-800 hover:bg-slate-700 text-teal-300 border-slate-700 hover:border-teal-500/50'
                                                        : 'bg-slate-100 hover:bg-teal-50 text-teal-800 border-slate-200 hover:border-teal-300'
                                                }`}
                                                title={`Insert ${sym} into message`}
                                            >
                                                {sym}
                                            </button>
                                        ))}
                                    </div>

                                    <form
                                        onSubmit={(e) => {
                                            e.preventDefault();
                                            handleSendChatMessage();
                                        }}
                                        className="flex items-center gap-2"
                                    >
                                        <div className="relative flex-1">
                                            <input
                                                ref={chatInputRef}
                                                type="text"
                                                value={chatInput}
                                                onChange={(e) => setChatInput(e.target.value)}
                                                placeholder={chatLoading ? "Assistant is formulating steps..." : "Ask a question or request a diagnostic hint..."}
                                                disabled={chatLoading}
                                                className={`w-full px-3.5 sm:px-4 py-2.5 text-sm rounded-2xl border focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 transition-all font-medium ${
                                                    theme === 'dark'
                                                        ? 'bg-slate-800/90 border-slate-700 text-white placeholder-slate-500'
                                                        : 'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-400'
                                                }`}
                                            />
                                        </div>
                                        <button
                                            type="submit"
                                            disabled={!chatInput.trim() || chatLoading}
                                            className="h-10 w-10 sm:h-11 sm:w-11 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 active:scale-95 text-white flex items-center justify-center shadow-md shadow-teal-500/20 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex-shrink-0 cursor-pointer"
                                            title="Send Message"
                                        >
                                            <i className="fa-solid fa-paper-plane text-xs sm:text-sm"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    ) : null)}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
