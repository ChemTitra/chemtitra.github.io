        // =========================================================================

        window.handleNodeClick = (topicId) => {

        };

        const renderProgressMap = (theme, currentFormStr, currentSubjectStr) => {
            const container = document.getElementById('progress-map');
            if (!container) return;
            container.innerHTML = ''; 

            const isDark = theme === 'dark';
            const formTarget = parseInt(currentFormStr.replace(/\D/g, ''), 10);
            const subjectTarget = currentSubjectStr.toLowerCase();
            const filteredData = curriculumData.filter(n => n.form === formTarget && n.subject === subjectTarget);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="text-center p-12 text-slate-400 font-medium">No nodes mapped for ${currentFormStr}.</div>`;
                return;
            }

            const trackLine = document.createElement('div');
            trackLine.className = `absolute left-8 md:left-1/2 top-0 bottom-0 w-1 transform md:-translate-x-1/2 rounded-full ${isDark ? 'bg-slate-800' : 'bg-slate-200'}`;
            container.appendChild(trackLine);

            filteredData.forEach((node, index) => {
                const isEven = index % 2 === 0;
                const itemWrapper = document.createElement('div');
                itemWrapper.className = `relative z-10 flex items-center mb-16 w-full ${isEven ? 'md:flex-row-reverse' : ''}`;
                
                itemWrapper.innerHTML = `

        const MolecularCanvas = ({ theme }) => {
            useEffect(() => {
                const canvas = document.getElementById('bg-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const particles = [];
                for (let i = 0; i < 40; i++) {
                    particles.push({
                        x: Math.random() * width, y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                        r: Math.random() * 2 + 1
                    });
                }

                function render() {
                    ctx.clearRect(0, 0, width, height);
                    ctx.fillStyle = theme === 'dark' ? '#14b8a6' : '#94a3b8';
                    ctx.globalAlpha = 0.2;
                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
                    });
                    requestAnimationFrame(render);
                }
                render();
            }, [theme]);
            return null;
        };

        function App() {
            const [theme, setTheme] = useState('eyecare');
            const [activeSubject, setActiveSubject] = useState('chemistry');
            const [selectedForm, setSelectedForm] = useState('Form 4');

            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('newest');
            const [filterLanguage, setFilterLanguage] = useState('ALL');
            const [showPeriodicTable, setShowPeriodicTable] = useState(false);
            const [selectedElement, setSelectedElement] = useState(null);

            const [currentUser, setCurrentUser] = useState(null);
            const [showOwnerModal, setShowOwnerModal] = useState(false);
            const [materials, setMaterials] = useState(() => {
                const saved = localStorage.getItem('chemtitra_materials_cache');
                return saved ? JSON.parse(saved) : INITIAL_MATERIALS;
            });
            const [activePdfItem, setActivePdfItem] = useState(null);
            const [avatarUrl, setAvatarUrl] = useState(() => localStorage.getItem('chemtitra_avatar_url') || PERMANENT_AVATAR_URL);

            const isAdmin = useMemo(() => currentUser?.email === AUTHORIZED_OWNER_EMAIL, [currentUser]);

            useEffect(() => {
                document.body.className = 'theme-' + theme;
                if (selectedCategory === 'Quiz') renderProgressMap(theme, selectedForm, (selectedForm.includes('1') || selectedForm.includes('2') || selectedForm.includes('3')) ? 'Science' : 'Chemistry');
            }, [theme, selectedCategory, selectedForm]);

            const handleSignOut = () => setCurrentUser(null);

            const filteredMaterials = useMemo(() => {
                let list = materials.filter(item => {
                    const matchesForm = item.form === selectedForm;
                    const matchesCategory = item.category === selectedCategory;
                    const matchesLang = filterLanguage === 'ALL' || item.language === filterLanguage;
                    const query = searchQuery.toLowerCase().trim();
                    const matchesSearch = !query || item.title.toLowerCase().includes(query) || (item.chapter && item.chapter.toLowerCase().includes(query));
                    return matchesForm && matchesCategory && matchesLang && matchesSearch;
                });
                return list.sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
            }, [materials, selectedForm, selectedCategory, searchQuery, filterLanguage]);

            return (
                <div className="min-h-screen relative z-10 flex flex-col">
                    <MolecularCanvas theme={theme} />

                    {/* SLIM STICKY HEADER */}
                    <header className={`sticky top-0 z-50 border-b backdrop-blur-xl transition-all ${
                        theme === 'dark' ? 'bg-slate-950/80 border-slate-800' : 
                        theme === 'eyecare' ? 'bg-white/80 border-slate-200' : 'bg-white/90 border-slate-200'
                    }`}>
                        <div className="max-w-7xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-teal-600 flex items-center justify-center text-white text-xl shadow-lg">
                                    <i className="fa-solid fa-flask-vial"></i>
                                </div>
                                <div className="leading-none">
                                    <h1 className="text-xl sm:text-2xl font-black tracking-tighter bg-gradient-to-r from-teal-600 to-indigo-600 bg-clip-text text-transparent">ChemTitra</h1>
                                    <p className="text-[10px] font-bold uppercase tracking-widest opacity-40 mt-0.5">Educational Matrix</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 sm:gap-4">
                                <button onClick={() => setShowPeriodicTable(true)} className="hidden md:flex items-center gap-2 px-4 py-2 rounded-xl border font-bold text-xs hover:bg-teal-600 hover:text-white transition-all shadow-sm">
                                    <i className="fa-solid fa-table-cells"></i> Periodic Table
                                </button>

                                {/* THEME SLIDING PILL */}
                                <div className={`relative flex items-center p-1 rounded-full border transition-all h-10 w-32 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-slate-100 border-slate-200'}`}>
                                    <div 
                                        className="absolute h-8 w-1/3 bg-white dark:bg-teal-600 rounded-full shadow-sm transition-all duration-300"
                                        style={{ left: theme === 'eyecare' ? '4px' : theme === 'dark' ? '42px' : '81px' }}
                                    ></div>
                                    <button onClick={() => setTheme('eyecare')} className="relative z-10 flex-1 text-xs"><i className={`fa-solid fa-eye ${theme === 'eyecare' ? 'text-teal-600' : 'text-slate-400'}`}></i></button>
                                    <button onClick={() => setTheme('dark')} className="relative z-10 flex-1 text-xs"><i className={`fa-solid fa-moon ${theme === 'dark' ? 'text-white' : 'text-slate-400'}`}></i></button>
                                    <button onClick={() => setTheme('light')} className="relative z-10 flex-1 text-xs"><i className={`fa-solid fa-sun ${theme === 'light' ? 'text-teal-600' : 'text-slate-400'}`}></i></button>
                                </div>

                                {isAdmin ? (
                                    <button onClick={handleSignOut} className="px-4 py-2 rounded-xl bg-teal-600 text-white text-xs font-bold">Sign Out</button>
                                ) : (
                                    <button onClick={() => setShowOwnerModal(true)} className="w-10 h-10 rounded-xl border flex items-center justify-center text-slate-400 hover:text-teal-600 transition-all"><i className="fa-solid fa-lock"></i></button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT WRAPPER */}
                    <main className="max-w-7xl mx-auto px-4 py-8 sm:py-12 w-full space-y-12">
                        
                        {/* PREMIUM INSTRUCTOR HERO */}
                        <div className="flex flex-col md:flex-row items-center gap-8 py-8 sm:py-12 border-b border-slate-200 dark:border-slate-800">
                            <div className="relative group">
                                <div className="absolute -inset-1 bg-gradient-to-tr from-teal-500 to-indigo-500 rounded-[40px] blur opacity-25 group-hover:opacity-40 transition-opacity"></div>
                                <img src={avatarUrl} className="relative w-24 h-24 sm:w-32 sm:h-32 rounded-[32px] object-cover shadow-2xl border-2 border-white dark:border-slate-900" />
                            </div>
                            <div className="text-center md:text-left space-y-3">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-500/10 text-teal-600 dark:text-teal-400 text-[10px] font-black tracking-widest uppercase border border-teal-500/20">
                                    <i className="fa-solid fa-check-circle"></i> Verified Educator
                                </div>
                                <h2 className="text-3xl sm:text-5xl font-black tracking-tighter">Ikmal Hafiz</h2>
                                <p className="text-base sm:text-lg opacity-60 font-medium leading-relaxed max-w-xl">B.Sc. Ed (Hons) Chemistry • UI TM Puncak Alam. Innovating high school Science & Chemistry through visual mastery.</p>
                                <button onClick={() => setShowInstructorModal(true)} className="text-xs font-extrabold text-teal-600 underline underline-offset-4 hover:opacity-70 transition-opacity">Full Portfolio & Bio <i className="fa-solid fa-arrow-right-long ml-1"></i></button>
                            </div>
                        </div>

                        {/* NAV CONTROL INTERFACE */}
                        <div className="space-y-8">
                            <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                                {/* SUBJECT SEGMENTED PILL */}
                                <div className={`flex p-1.5 rounded-full border shadow-sm ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-slate-100 border-slate-200'}`}>
                                    <button 
                                        onClick={() => { setActiveSubject('science'); setSelectedForm('Form 1'); }}
                                        className={`px-8 py-2.5 rounded-full text-xs font-black transition-all ${activeSubject === 'science' ? 'bg-teal-600 text-white shadow-lg' : 'opacity-50'}`}
                                    >Science (F1-F3)</button>
                                    <button 
                                        onClick={() => { setActiveSubject('chemistry'); setSelectedForm('Form 4'); }}
                                        className={`px-8 py-2.5 rounded-full text-xs font-black transition-all ${activeSubject === 'chemistry' ? 'bg-teal-600 text-white shadow-lg' : 'opacity-50'}`}
                                    >Chemistry (F4-F5)</button>
                                </div>

                                {/* FORM TABS */}
                                <div className="flex gap-2">
                                    {(activeSubject === 'science' ? ['Form 1', 'Form 2', 'Form 3'] : ['Form 4', 'Form 5']).map(f => (
                                        <button 
                                            key={f} 
                                            onClick={() => setSelectedForm(f)} 
                                            className={`px-6 py-2.5 rounded-xl text-xs font-bold transition-all border ${selectedForm === f ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 border-slate-900' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 opacity-60'}`}
                                        >{f}</button>
                                    ))}
                                </div>
                            </div>

                            {/* CATEGORY NAV SYSTEM */}
                            <div className="grid grid-cols-3 gap-2 p-1.5 rounded-[32px] bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                                {['Notes', 'Exercises', 'Quiz'].map(c => (
                                    <button 
                                        key={c} 
                                        onClick={() => setSelectedCategory(c)} 
                                        className={`py-4 sm:py-5 rounded-[24px] text-sm font-black flex items-center justify-center gap-3 transition-all ${selectedCategory === c ? 'bg-white dark:bg-slate-800 shadow-xl' : 'opacity-40 hover:opacity-100'}`}
                                    >
                                        <i className={`fa-solid ${c === 'Notes' ? 'fa-book-open' : c === 'Exercises' ? 'fa-pen-ruler' : 'fa-brain'}`}></i>
                                        {c}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* MATERIAL DISPLAY LAYER */}
                        {selectedCategory === 'Quiz' ? (
                            <div id="progress-map" className="relative py-12 px-4 min-h-[500px]"></div>
                        ) : (
                            <div className="space-y-6">
                                {/* SEARCH TOOLBAR */}
                                <div className="flex flex-col md:flex-row gap-4 items-center">
                                    <div className="flex-1 relative w-full">
                                        <i className="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 opacity-30"></i>
                                        <input 
                                            type="text" 
                                            value={searchQuery} 
                                            onChange={(e) => setSearchQuery(e.target.value)} 
                                            placeholder={`Find ${selectedForm} ${selectedCategory}...`} 
                                            className="w-full pl-12 pr-4 py-4 rounded-2xl border dark:bg-slate-900 dark:border-slate-800 focus:ring-2 ring-teal-500 outline-none transition-all shadow-sm" 
                                        />
                                    </div>
                                    <div className="flex gap-2 w-full md:w-auto">
                                        <select value={filterLanguage} onChange={(e) => setFilterLanguage(e.target.value)} className="flex-1 md:flex-none px-4 py-4 rounded-2xl border dark:bg-slate-900 dark:border-slate-800 font-bold text-xs outline-none">
                                            <option value="ALL">🌐 All</option>
                                            <option value="DLP">🇬🇧 DLP</option>
                                            <option value="BM">🇲🇾 BM</option>
                                        </select>
                                    </div>
                                </div>

                                {/* CARDS GRID */}
                                {filteredMaterials.length === 0 ? (
                                    <div className="rounded-[32px] p-20 text-center space-y-4 border-2 border-dashed border-slate-200 dark:border-slate-800">
                                        <div className="w-20 h-20 rounded-3xl bg-slate-50 dark:bg-slate-900 flex items-center justify-center text-4xl mx-auto text-slate-300">
                                            <i className="fa-solid fa-folder-open"></i>
                                        </div>
                                        <h3 className="text-xl font-bold">Portal empty for now</h3>
                                        <p className="opacity-50 text-sm">Ikmal Hafiz is finalizing new content. Check back shortly!</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {filteredMaterials.map(item => (
                                            <div key={item.id} className="modern-glass p-6 space-y-4 flex flex-col justify-between">
                                                <div className="space-y-4">
                                                    <div className="flex justify-between items-center">
                                                        <span className="p-2 rounded-xl bg-teal-500/10 text-teal-600 text-xs font-black uppercase tracking-widest">{item.category}</span>
                                                        <span className="text-[10px] font-black px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg">{item.language}</span>
                                                    </div>
                                                    <h4 className="text-lg font-extrabold leading-tight">{item.title}</h4>
                                                    <p className="text-xs opacity-50 line-clamp-2 leading-relaxed">{item.description}</p>
                                                </div>
                                                <div className="pt-4 flex items-center justify-between border-t border-slate-100 dark:border-slate-800">
                                                    <span className="text-[10px] font-bold opacity-40 uppercase tracking-widest">{item.chapter}</span>
                                                    <button onClick={() => setActivePdfItem(item)} className="px-4 py-2 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-[10px] font-black uppercase tracking-widest hover:scale-105 transition-all">Preview <i className="fa-solid fa-chevron-right ml-1"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODALS SECTION */}

                    {/* FULL PERIODIC TABLE MATRIX */}
                    {showPeriodicTable && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-2 sm:p-6 animate-fade-in">
                            <div className={`w-full max-w-6xl h-[90vh] rounded-[40px] flex flex-col shadow-2xl border overflow-hidden ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                <div className="p-6 border-b flex justify-between items-center border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-2xl bg-teal-600 text-white flex items-center justify-center"><i className="fa-solid fa-table"></i></div>
                                        <h2 className="text-xl font-black">Periodic Table <span className="text-teal-500">Elements</span></h2>
                                    </div>
                                    <button onClick={() => setShowPeriodicTable(false)} className="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center hover:scale-110 transition-transform"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="flex-1 overflow-auto pt-scroll p-4 sm:p-8">
                                    <div className="grid gap-1.5 min-w-[1000px]" style={{ gridTemplateColumns: 'repeat(18, minmax(0, 1fr))' }}>
                                        {ELEMENTS.map(el => (
                                            <div 
                                                key={el.n} 
                                                onClick={() => setSelectedElement(el)}
                                                className={`aspect-square p-1 rounded-xl text-white flex flex-col items-center justify-center cursor-pointer hover:scale-110 transition-all shadow-sm ${
                                                    el.cat === 'nonmetal' ? 'bg-emerald-500' : 
                                                    el.cat === 'noble-gas' ? 'bg-purple-500' :
                                                    el.cat === 'alkali-metal' ? 'bg-rose-500' :
                                                    el.cat === 'transition-metal' ? 'bg-indigo-500' : 'bg-slate-500'
                                                }`} 
                                                style={{ gridColumn: el.c, gridRow: el.r }}
                                            >
                                                <span className="text-[8px] font-black opacity-60 leading-none">{el.n}</span>
                                                <span className="text-sm font-black">{el.sym}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                {selectedElement && (
                                    <div className="p-8 bg-slate-950/20 border-t border-slate-200 dark:border-slate-800 animate-slide-up">
                                        <div className="flex items-center gap-6">
                                            <div className="text-5xl font-black text-teal-500">{selectedElement.sym}</div>
                                            <div>
                                                <h3 className="text-2xl font-bold">{selectedElement.name}</h3>
                                                <p className="text-xs opacity-50 uppercase tracking-[0.2em]">{selectedElement.cat} • {selectedElement.state}</p>
                                                <p className="mt-2 text-sm max-w-2xl font-medium opacity-80 leading-relaxed italic">"{selectedElement.f}"</p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* OWNER ACCESS MODAL */}
                    {showOwnerModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md">
                            <div className="bg-slate-900 border border-slate-800 rounded-[32px] p-10 w-full max-w-md space-y-6 text-center">
                                <div className="w-16 h-16 bg-teal-600 rounded-3xl mx-auto flex items-center justify-center text-3xl text-white shadow-lg"><i className="fa-solid fa-shield-halved"></i></div>
                                <div>
                                    <h3 className="text-2xl font-black text-white">Owner Access</h3>
                                    <p className="text-xs text-slate-500 mt-1">Educator sign-in required for portal management.</p>
                                </div>
                                <button onClick={() => { setCurrentUser({ email: AUTHORIZED_OWNER_EMAIL }); setShowOwnerModal(false); }} className="w-full py-4 rounded-2xl bg-white text-slate-950 font-black flex items-center justify-center gap-3 hover:scale-105 transition-all">
                                    <i className="fa-brands fa-google"></i> Sign in with Google
                                </button>
                                <button onClick={() => setShowOwnerModal(false)} className="text-slate-600 hover:text-white transition-colors text-xs font-bold">Go Back</button>
                            </div>
                        </div>
                    )}

                    {/* PDF READER MODAL */}
                    {activePdfItem && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-2 sm:p-8 bg-slate-950/95 backdrop-blur-md">
                            <div className="bg-white rounded-[40px] w-full max-w-5xl h-full flex flex-col overflow-hidden shadow-2xl">
                                <div className="p-4 sm:p-6 bg-slate-50 border-b flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl bg-teal-500/10 text-teal-600 flex items-center justify-center font-bold text-lg"><i className="fa-solid fa-file-pdf"></i></div>
                                        <h3 className="font-extrabold text-slate-900 truncate max-w-xs sm:max-w-md">{activePdfItem.title}</h3>
                                    </div>
                                    <button onClick={() => setActivePdfItem(null)} className="w-10 h-10 rounded-full bg-slate-200 text-slate-900 flex items-center justify-center hover:scale-110 transition-transform"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <iframe src={activePdfItem.fileUrl} className="flex-1 border-0" sandbox="allow-scripts allow-same-origin" />
                            </div>
                        </div>
                    )}

                    {/* INSTRUCTOR MODAL */}
                    {showInstructorModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md">
                            <div className={`w-full max-w-lg rounded-[40px] p-8 sm:p-10 border shadow-2xl space-y-6 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                <div className="text-center space-y-4">
                                    <img src={avatarUrl} className="w-24 h-24 sm:w-32 sm:h-32 rounded-[32px] mx-auto object-cover shadow-2xl border-2 border-teal-500" />
                                    <div>
                                        <h3 className="text-2xl font-black">Ikmal Hafiz</h3>
                                        <p className="text-sm font-bold text-teal-600 tracking-widest uppercase">Science & Chemistry Specialist</p>
                                    </div>
                                </div>
                                <div className="space-y-4 text-sm leading-relaxed opacity-80 font-medium">
                                    <p>I am a passionate educator with a Bachelor of Science Education (Hons.) in Chemistry from Universiti Teknologi MARA (UiTM) Puncak Alam.</p>
                                    <p>My goal is to simplify the KSSM syllabus through structured, high-quality digital materials that focus on conceptual clarity and exam readiness for Form 1-5 students.</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="p-4 rounded-3xl bg-slate-100 dark:bg-slate-800 text-center">
                                        <div className="text-xl font-black text-teal-600">F1 - F3</div>
                                        <div className="text-[10px] font-bold opacity-50 uppercase">Science</div>
                                    </div>
                                    <div className="p-4 rounded-3xl bg-slate-100 dark:bg-slate-800 text-center">
                                        <div className="text-xl font-black text-indigo-600">F4 - F5</div>
                                        <div className="text-[10px] font-bold opacity-50 uppercase">Chemistry</div>
                                    </div>
                                </div>
                                <button onClick={() => setShowInstructorModal(false)} className="w-full py-4 rounded-2xl bg-teal-600 text-white font-black hover:scale-105 transition-all">Close Profile</button>
                            </div>
                        </div>
                    )}

                    {/* STICKY FOOTER */}
                    <footer className="py-12 mt-20 border-t border-slate-200 dark:border-slate-800 text-center opacity-40 text-[10px] font-black uppercase tracking-[0.4em]">
                        ChemTitra Matrix &copy; 2026 • Designed for Academic Excellence
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
