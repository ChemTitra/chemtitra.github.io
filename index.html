        const MolecularCanvas = ({ theme }) => {
            useEffect(() => {
                const canvas = document.getElementById('bg-canvas');
                if (!canvas) return;
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (prefersReducedMotion) return;

                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let isPaused = document.hidden;
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const handleResize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                window.addEventListener('resize', handleResize);

                const handleVisibility = () => {
                    isPaused = document.hidden;
                    if (!isPaused) { animationFrameId = requestAnimationFrame(render); }
                };
                document.addEventListener('visibilitychange', handleVisibility);

                const numParticles = Math.min(80, Math.floor((width * height) / 24000));
                const particles = [];
                const colors = theme === 'dark' 
                    ? ['#14b8a6', '#38bdf8', '#818cf8', '#2dd4bf', '#60a5fa']
                    : theme === 'eyecare'
                    ? ['#0f766e', '#0284c7', '#4338ca', '#0d9488', '#1e40af']
                    : ['#0d9488', '#0284c7', '#6366f1', '#14b8a6', '#0284c7'];

                for (let i = 0; i < numParticles; i++) {
                    particles.push({
                        x: Math.random() * width, y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                        radius: Math.random() * 2 + 1,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    const strokeAlpha = theme === 'dark' ? 0.22 : theme === 'eyecare' ? 0.16 : 0.25;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = theme === 'dark'
                                    ? `rgba(100, 116, 139, ${strokeAlpha * (1 - dist / 120)})`
                                    : `rgba(148, 163, 184, ${strokeAlpha * (1 - dist / 120)})`;
                                ctx.lineWidth = 0.75;
                                ctx.stroke();
                            }
                        }
                    }

                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    });

                    if (!isPaused) { animationFrameId = requestAnimationFrame(render); }
                };

                render();
                return () => {
                    window.removeEventListener('resize', handleResize);
                    document.removeEventListener('visibilitychange', handleVisibility);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [theme]);
            return null;
        };

            const SUB_MAP = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉', '+': '₊', '-': '₋' };
            const SUP_MAP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '+': '⁺', '-': '⁻' };

            const cleanChemicalSymbols = (raw) => {
                if (!raw) return '';
                let s = raw;
                // Unwrap LaTeX text/ce/pu/mathrm blocks: \text{H2O} -> H2O
                s = s.replace(/\\(?:text|mathrm|mathbf|ce|pu|mathit)\{([^}]+)\}/g, '$1');
                // Common LaTeX arrow and symbol commands
                s = s.replace(/\\(?:longrightarrow|rightarrow|to)\b/g, '→');
                s = s.replace(/\\(?:longleftarrow|leftarrow)\b/g, '←');
                s = s.replace(/\\(?:rightleftharpoons|leftrightharpoons)\b/g, '⇌');
                s = s.replace(/\\Delta\b/g, 'Δ');
                s = s.replace(/\\times\b/g, '×');
                s = s.replace(/\\cdot\b/g, '•');
                s = s.replace(/\\approx\b/g, '≈');
                s = s.replace(/\\pm\b/g, '±');
                s = s.replace(/\\circ\b/g, '°');
                s = s.replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1 / $2)');
                // Strip LaTeX spacers and formatting tags
                s = s.replace(/\\(?:quad|qquad|;|!|,|\s)/g, ' ');
                // Strip LaTeX math wrapper delimiters $ ... $, $$ ... $$, \( ... \), \[ ... \]
                s = s.replace(/\$\$([\s\S]*?)\$\$/g, '$1');
                s = s.replace(/\$([^\$]+)\$/g, '$1');
                s = s.replace(/\\\(([\s\S]*?)\\\)/g, '$1');
                s = s.replace(/\\\[([\s\S]*?)\\\]/g, '$1');
                // Convert subscript patterns: _{2} or _2
                s = s.replace(/_\{([0-9+\-]+)\}/g, (_, chars) => chars.split('').map(c => SUB_MAP[c] || c).join(''));
                s = s.replace(/_([0-9])/g, (_, digit) => SUB_MAP[digit] || digit);
                // Convert superscript patterns: ^{2+} or ^2+
                s = s.replace(/\^\{([0-9+\-]+)\}/g, (_, chars) => chars.split('').map(c => SUP_MAP[c] || c).join(''));
                s = s.replace(/\^([0-9+\-])/g, (_, char) => SUP_MAP[char] || char);
                // Remove stray backslashes before words
                s = s.replace(/\\([a-zA-Z]+)/g, '$1');
                return s;
            };

            const [materials, setMaterials] = useState(() => {
                const saved = localStorage.getItem('chemtitra_materials_cache');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    } catch (e) {
                        console.warn("Using default initial materials.");
                    }
                }
                return INITIAL_MATERIALS;
            });

            // --- STATE FOR MATERIAL PROGRESS & CELEBRATION (PILLARS 1, 3 & 4) ---
            const [completedMaterials, setCompletedMaterials] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('chemtitra_completed_materials');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            const triggerCelebration = (label) => {
                if (typeof document === 'undefined') return;
                try {
                    const container = document.createElement('div');
                    container.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:99999;overflow:hidden;';
                    document.body.appendChild(container);
                    
                    const colors = ['#14b8a6', '#06b6d4', '#6366f1', '#f59e0b', '#10b981', '#ec4899'];
                    for (let i = 0; i < 36; i++) {
                        const conf = document.createElement('div');
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        const left = Math.random() * 100;
                        const size = Math.random() * 8 + 6;
                        const duration = Math.random() * 1.5 + 1.2;
                        const delay = Math.random() * 0.25;
                        conf.style.cssText = `
                            position:absolute;
                            top:-20px;
                            left:${left}vw;
                            width:${size}px;
                            height:${size * 1.3}px;
                            background-color:${color};
                            border-radius:2px;
                            opacity:1;
                            transform:rotate(${Math.random() * 360}deg);
                            transition:transform ${duration}s cubic-bezier(0.25, 1, 0.5, 1), top ${duration}s ease-in, opacity ${duration}s ease-out;
                            transition-delay:${delay}s;
                        `;
                        container.appendChild(conf);
                        setTimeout(() => {
                            conf.style.top = '105vh';
                            conf.style.transform = `rotate(${Math.random() * 720}deg) scale(0.7)`;
                            conf.style.opacity = '0';
                        }, 25);
                    }
                    setTimeout(() => {
                        if (container.parentNode) container.parentNode.removeChild(container);
                    }, 2800);
                } catch(e) {
                    console.warn('Celebration effect skipped', e);
                }
            };

            const toggleMaterialCompleted = (id, title, e) => {
                if (e) e.stopPropagation();
                if (completedMaterials.includes(id)) {
                    const updated = completedMaterials.filter(itemId => itemId !== id);
                    setCompletedMaterials(updated);
                    localStorage.setItem('chemtitra_completed_materials', JSON.stringify(updated));
                    showToast(`Marked "${title || 'Topic'}" as in-progress.`, 'info');
                } else {
                    const updated = [...completedMaterials, id];
                    setCompletedMaterials(updated);
                    localStorage.setItem('chemtitra_completed_materials', JSON.stringify(updated));
                    triggerCelebration(title);
                    showToast(`🎉 Module Mastered: "${title || 'Topic'}"!`, 'success');
                }
            };

            const handleOpenMaterial = (id, link, title) => {
                if (!completedMaterials.includes(id)) {
                    const updated = [...completedMaterials, id];
                    setCompletedMaterials(updated);
                    localStorage.setItem('chemtitra_completed_materials', JSON.stringify(updated));
                    triggerCelebration(title);
                }
                if (link) {
                    window.open(link, '_blank');
                }
            };

            // Form Syllabus Mastery Tracking (Pillars 1 & 4)
            const formTotalCount = useMemo(() => {
                return materials.filter(m => m.form === selectedForm).length;
            }, [materials, selectedForm]);

            const formMasteryCompletedCount = useMemo(() => {
                return materials.filter(m => m.form === selectedForm && completedMaterials.includes(m.id)).length;
            }, [materials, selectedForm, completedMaterials]);

            const formMasteryPercentage = useMemo(() => {
                if (formTotalCount === 0) return 0;
                return Math.round((formMasteryCompletedCount / formTotalCount) * 100);
            }, [formTotalCount, formMasteryCompletedCount]);

            const [announcement, setAnnouncement] = useState(() => {
                return localStorage.getItem('chemtitra_announcement') || '📢 Welcome to ChemTitra! Explore curated KSSM notes, exam exercises and interactive quizzes.';
            });
            const [isEditingAnnouncement, setIsEditingAnnouncement] = useState(false);
            const [announcementInput, setAnnouncementInput] = useState(announcement);

            const [currentUser, setCurrentUser] = useState(null);
            const [showOwnerModal, setShowOwnerModal] = useState(false);
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');
            const [firebaseAuth, setFirebaseAuth] = useState(null);
            const [db, setDb] = useState(null);

            const [avatarUrl, setAvatarUrl] = useState(() => {
                return localStorage.getItem('chemtitra_avatar_url') || PERMANENT_AVATAR_URL;
            });
            const [avatarSaving, setAvatarSaving] = useState(false);
            const [showAvatarUrlModal, setShowAvatarUrlModal] = useState(false);
            const [avatarUrlInput, setAvatarUrlInput] = useState('');

            const isAdmin = useMemo(() => {
                return !!(
                    currentUser && 
                    currentUser.email && 
                    currentUser.email.trim().toLowerCase() === AUTHORIZED_OWNER_EMAIL.trim().toLowerCase()
                );
            }, [currentUser]);

            const [showMaterialModal, setShowMaterialModal] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [activePdfItem, setActivePdfItem] = useState(null);
            const [itemToDelete, setItemToDelete] = useState(null);

            const [formData, setFormData] = useState({
                form: 'Form 4', subject: 'Chemistry', category: 'Notes',
                chapter: '', title: '', description: '', fileUrl: '',
                language: 'DLP', tags: ''
            });

            useEffect(() => {
                localStorage.setItem('chemtitra_materials_cache', JSON.stringify(materials));
            }, [materials]);

            useEffect(() => {
                document.body.className = 'theme-' + theme;
            }, [theme]);

            const getSubjectForForm = (formName) => {
                return (formName === 'Form 1' || formName === 'Form 2' || formName === 'Form 3') ? 'Science' : 'Chemistry';
            };

            useEffect(() => {
                if (selectedCategory === 'Quiz') {
                    renderProgressMap(theme, selectedForm, getSubjectForForm(selectedForm));
                }
            }, [selectedCategory, theme, selectedForm]);

            useEffect(() => {
                if (!window.FirebaseModule) return;
                const { 
                    initializeApp, 
                    getAuth, 
                    onAuthStateChanged, 
                    getFirestore, 
                    collection, 
                    doc, 
                    onSnapshot 
                } = window.FirebaseModule;

                let unsubscribeAuth = () => {};
                let unsubscribeFirestore = () => {};
                let unsubscribeProfile = () => {};

                try {
                    const app = initializeApp(FIREBASE_CONFIG);
                    const authInst = getAuth(app);
                    const dbInst = getFirestore(app);
                    setFirebaseAuth(authInst);
                    setDb(dbInst);

                    unsubscribeAuth = onAuthStateChanged(authInst, (user) => {
                        if (user) {
                            if (user.email && user.email.trim().toLowerCase() === AUTHORIZED_OWNER_EMAIL.trim().toLowerCase()) {
                                setCurrentUser(user);
                                showToast(`Welcome back, Ikmal!`, 'success');
                            } else {
                                setCurrentUser(null);
                                setAuthError(`Access Denied: ${user.email} is not authorized.`);
                                window.FirebaseModule.signOut(authInst);
                            }
                        } else {
                            setCurrentUser(null);
                        }
                    });

                    const materialsRef = collection(dbInst, 'chemtitra_materials');
                    unsubscribeFirestore = onSnapshot(materialsRef, (snapshot) => {
                        if (!snapshot.empty) {
                            const fetched = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setMaterials(fetched);
                        }
                    }, (err) => {
                        console.warn('Using local cache for materials:', err.message);
                    });

                    const profileConfigRef = doc(dbInst, 'chemtitra_config', 'profile');
                    unsubscribeProfile = onSnapshot(profileConfigRef, (snap) => {
                        if (snap.exists() && snap.data().avatarUrl) {
                            setAvatarUrl(snap.data().avatarUrl);
                            localStorage.setItem('chemtitra_avatar_url', snap.data().avatarUrl);
                        }
                    }, (err) => {
                        console.warn('Using cached/default avatar:', err.message);
                    });

                } catch (e) {
                    console.warn('Firebase init error (using offline mode):', e);
                }
                
                return () => {
                    unsubscribeAuth();
                    unsubscribeFirestore();
                    unsubscribeProfile();
                };
            }, []);

            const handleGoogleSignIn = async () => {
                setAuthError('');
                setAuthLoading(true);

                if (!firebaseAuth || !window.FirebaseModule) {
                    setAuthLoading(false);
                    setAuthError("Firebase is not yet configured.");
                    return;
                }

                try {
                    const { signInWithPopup, GoogleAuthProvider, signOut } = window.FirebaseModule;
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });

                    const result = await signInWithPopup(firebaseAuth, provider);
                    const user = result.user;

                    if (user && user.email && user.email.trim().toLowerCase() === AUTHORIZED_OWNER_EMAIL.trim().toLowerCase()) {
                        setCurrentUser(user);
                        setShowOwnerModal(false);
                        setAuthLoading(false);
                        showToast("Owner access verified via Google!", "success");
                    } else {
                        await signOut(firebaseAuth);
                        setCurrentUser(null);
                        setAuthLoading(false);
                        setAuthError(`Access Denied: ${user.email} is not authorized.`);
                    }
                } catch (error) {
                    setAuthLoading(false);
                    if (error.code === 'auth/popup-closed-by-user') {
                        setAuthError("Sign-in cancelled. Please try again.");
                    } else {
                        setAuthError(error.message || "An error occurred during Google Sign-In.");
                    }
                }
            };

            const handleSignOut = async () => {
                if (firebaseAuth && window.FirebaseModule && currentUser) {
                    await window.FirebaseModule.signOut(firebaseAuth);
                }
                setCurrentUser(null);
                showToast("Signed out. Switched to Student View.", "info");
            };

            const isLikelyImageUrl = (value) => {
                try {
                    const parsed = new URL(value);
                    return parsed.protocol === 'https:' || parsed.protocol === 'http:';
                } catch {
                    return false;
                }
            };

            const handleSaveAvatarUrl = async () => {
                const url = avatarUrlInput.trim();
                if (!url) return showToast('Please paste an image URL first.', 'error');
                if (!isLikelyImageUrl(url)) return showToast('That doesn\'t look like a valid link — make sure it starts with https://', 'error');
                if (!isAdmin || !db || !window.FirebaseModule) return showToast('Not ready yet — please try again in a moment.', 'error');

                setAvatarSaving(true);
                try {
                    const { doc, setDoc } = window.FirebaseModule;
                    await setDoc(doc(db, 'chemtitra_config', 'profile'), {
                        avatarUrl: url,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });

                    setAvatarUrl(url);
                    localStorage.setItem('chemtitra_avatar_url', url);
                    showToast('Profile photo updated!', 'success');
                    setShowAvatarUrlModal(false);
                    setAvatarUrlInput('');
                } catch (err) {
                    showToast(err.message || 'Failed to save the photo link. Please try again.', 'error');
                } finally {
                    setAvatarSaving(false);
                }
            };

            const handleViewMaterial = (item) => {
                setActivePdfItem(item);
                const updatedViews = (item.views || 0) + 1;
                setMaterials(prev => prev.map(m => m.id === item.id ? { ...m, views: updatedViews } : m));
            };

            const openEditor = (item = null) => {
                if (item) {
                    setEditingItem(item);
                    setFormData({
                        form: item.form,
                        subject: item.subject,
                        category: item.category,
                        chapter: item.chapter || '',
                        title: item.title || '',
                        description: item.description || '',
                        fileUrl: item.rawUrl || item.fileUrl || '',
                        language: item.language || 'DLP',
                        tags: item.tags ? item.tags.join(', ') : ''
                    });
                } else {
                    setEditingItem(null);
                    setFormData({
                        form: selectedForm,
                        subject: getSubjectForForm(selectedForm),
                        category: selectedCategory,
                        chapter: '',
                        title: '',
                        description: '',
                        fileUrl: '',
                        language: 'DLP',
                        tags: ''
                    });
                }
                setShowMaterialModal(true);
            };

            const handleSaveMaterial = async (e) => {
                e.preventDefault();
                if (!formData.title || !formData.fileUrl) return showToast('Please enter both the title and document URL.', 'error');

                const formattedUrl = formData.category === 'Quiz' ? formData.fileUrl.trim() : formatEmbedUrl(formData.fileUrl);
                const tagsArray = formData.tags ? formData.tags.split(',').map(t => t.trim()).filter(Boolean) : ['KSSM'];

                const newItemData = {
                    form: formData.form,
                    subject: getSubjectForForm(formData.form),
                    category: formData.category,
                    chapter: formData.chapter.trim() || 'General Topic',
                    title: formData.title,
                    description: formData.description,
                    fileUrl: formattedUrl,
                    rawUrl: formData.fileUrl,
                    language: formData.language || 'DLP',
                    views: editingItem ? (editingItem.views || 0) : 0,
                    updatedAt: new Date().toISOString().split('T')[0],
                    tags: tagsArray
                };

                try {
                    if (db && window.FirebaseModule) {
                        const { doc, setDoc, addDoc, collection } = window.FirebaseModule;
                        if (editingItem) {
                            const docRef = doc(db, 'chemtitra_materials', editingItem.id);
                            await setDoc(docRef, newItemData, { merge: true });
                        } else {
                            const colRef = collection(db, 'chemtitra_materials');
                            await addDoc(colRef, newItemData);
                        }
                    } else {
                        if (editingItem) {
                            setMaterials(prev => prev.map(m => m.id === editingItem.id ? { ...m, ...newItemData } : m));
                        } else {
                            const id = 'mat-' + Date.now();
                            setMaterials(prev => [{ id, ...newItemData }, ...prev]);
                        }
                    }

                    showToast(editingItem ? '🎉 Success! Material updated successfully!' : '🎉 Success! Material published successfully!', 'success');
                    setShowMaterialModal(false);
                    
                    setFormData({
                        form: formData.form,
                        subject: getSubjectForForm(formData.form),
                        category: formData.category,
                        chapter: '',
                        title: '',
                        description: '',
                        fileUrl: '',
                        language: formData.language,
                        tags: ''
                    });

                } catch (err) {
                    if (editingItem) {
                        setMaterials(prev => prev.map(m => m.id === editingItem.id ? { ...m, ...newItemData } : m));
                    } else {
                        const id = 'mat-' + Date.now();
                        setMaterials(prev => [{ id, ...newItemData }, ...prev]);
                    }

                    showToast('🎉 Success! Saved to local storage.', 'success');
                    setShowMaterialModal(false);
                    
                    setFormData({
                        form: formData.form,
                        subject: getSubjectForForm(formData.form),
                        category: formData.category,
                        chapter: '',
                        title: '',
                        description: '',
                        fileUrl: '',
                        language: formData.language,
                        tags: ''
                    });
                }
            };

            const confirmDeleteMaterial = async () => {
                if (!itemToDelete) return;
                
                const material = itemToDelete;
                
                if (!material.id) { 
                    console.error("Missing document ID"); 
                    setMaterials(prev => prev.filter(m => m !== material));
                    setItemToDelete(null);
                    return; 
                }
                
                setMaterials(prev => prev.filter(m => m.id !== material.id));

                try {
                    if (db && window.FirebaseModule) {
                        const { doc, deleteDoc } = window.FirebaseModule;
                        await deleteDoc(doc(db, "chemtitra_materials", material.id));
                    }
                    showToast('🗑 Material deleted successfully.', 'info');
                } catch (err) {
                    console.error("Delete error:", err);
                    showToast('Removed from screen (DB error: ' + err.message + ')', 'error');
                } finally {
                    setItemToDelete(null);
                }
            };

            const alternateLanguageCount = useMemo(() => {
                if (filterLanguage === 'ALL') return 0;
                const targetAlt = filterLanguage === 'BM' ? 'DLP' : 'BM';
                return materials.filter(m => m.form === selectedForm && m.category === selectedCategory && m.language === targetAlt).length;
            }, [materials, selectedForm, selectedCategory, filterLanguage]);

            const currentFormFavoritesCount = useMemo(() => {
                return materials.filter(m => m.form === selectedForm && favorites.includes(m.id)).length;
            }, [materials, selectedForm, favorites]);

            const filteredMaterials = useMemo(() => {
                let list = materials.filter(item => {
                    const matchesForm = item.form === selectedForm;
                    const matchesCategory = item.category === selectedCategory;
                    const matchesLang = filterLanguage === 'ALL' || (item.language && item.language === filterLanguage);
                    const matchesFav = !showFavoritesOnly || favorites.includes(item.id);
                    const query = searchQuery.toLowerCase().trim();
                    const matchesSearch = !query ||
                        item.title.toLowerCase().includes(query) ||
                        (item.chapter && item.chapter.toLowerCase().includes(query)) ||
                        (item.description && item.description.toLowerCase().includes(query)) ||
                        (item.tags && item.tags.some(t => t.toLowerCase().includes(query)));
                    return matchesForm && matchesCategory && matchesLang && matchesFav && matchesSearch;
                });

                list.sort((a, b) => {
                    if (sortBy === 'newest') return (b.updatedAt || '').localeCompare(a.updatedAt || '');
                    else if (sortBy === 'oldest') return (a.updatedAt || '').localeCompare(b.updatedAt || '');
                    else if (sortBy === 'chapter') return (a.chapter || '').localeCompare(b.chapter || '');
                    else if (sortBy === 'views') return (b.views || 0) - (a.views || 0);
                    return 0;
                });

                return list;
            }, [materials, selectedForm, selectedCategory, searchQuery, sortBy, filterLanguage, showFavoritesOnly, favorites]);

            return (
                <div className="min-h-screen relative z-10 flex flex-col font-sans">
                    <MolecularCanvas theme={theme} />

                    {/* Toast Notification */}
                    {toast.show && (
                        <div className="fixed top-5 right-5 z-50 animate-bounce transition-all">
                            <div className={`px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 text-sm font-bold border backdrop-blur-md ${
                                toast.type === 'success' ? 'bg-teal-950/90 text-teal-200 border-teal-500/60 shadow-teal-500/20' :
                                toast.type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-500/60 shadow-rose-500/20' :
                                'bg-slate-900/90 text-slate-100 border-slate-700/80 shadow-slate-950/40'
                            }`}>
                                <i className={`fa-solid ${
                                    toast.type === 'success' ? 'fa-circle-check text-teal-400' :
                                    toast.type === 'error' ? 'fa-triangle-exclamation text-rose-400' :
                                    'fa-circle-info text-cyan-400'
                                } text-base`}></i>
                                <span>{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {/* Top Navigation Header */}
                    <header className={`border-b sticky top-0 z-40 backdrop-blur-xl shadow-sm transition-all duration-300 ${
                        theme === 'dark' ? 'bg-slate-900/90 border-slate-800/80' :
                        theme === 'eyecare' ? 'bg-[#f4f6fa]/95 border-slate-300/70' :
                        'bg-white/95 border-slate-200/80'
                    }`}>
                        <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-2 sm:gap-4">
                            {/* Brand / Logo */}
                            <div className="flex items-center space-x-2 sm:space-x-3.5 flex-shrink-0">
                                <div 
                                    onClick={() => !isAdmin && setShowOwnerModal(true)}
                                    className="w-10 h-10 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-gradient-to-tr from-teal-600 via-cyan-600 to-indigo-600 flex items-center justify-center text-white font-black text-lg sm:text-2xl shadow-md shadow-teal-600/25 cursor-pointer transition-transform duration-300 hover:scale-105 active:scale-95 relative flex-shrink-0"
                                    title={isAdmin ? "Owner Mode Active" : "Click for Owner Access"}
                                >
                                    <i className="fa-solid fa-flask-vial" aria-hidden="true"></i>
                                    {!isAdmin && (
                                        <span className="absolute -bottom-1 -right-1 w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-amber-500 text-white flex items-center justify-center text-[8px] sm:text-[9px] shadow-md border-2 border-white dark:border-slate-900">
                                            <i className="fa-solid fa-lock" aria-hidden="true"></i>
                                        </span>
                                    )}
                                </div>
                                <div className="flex items-center space-x-2">
                                    <h1 className="text-xl sm:text-2xl font-black tracking-tight leading-none bg-gradient-to-r from-teal-600 via-cyan-600 to-indigo-600 bg-clip-text text-transparent">
                                        ChemTitra
                                    </h1>
                                    <span className="hidden min-[400px]:inline-block text-[10px] sm:text-xs uppercase tracking-wider px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-700 dark:text-teal-300 border border-teal-500/20 font-extrabold whitespace-nowrap">
                                        EduPortal
                                    </span>
                                </div>
                            </div>

                            {/* Header Controls: Periodic Table, Eye-Care/Dark/Light Mode Switcher, Owner Access */}
                            <div className="flex items-center space-x-1.5 sm:space-x-3 flex-shrink-0">
                                {/* Dynamic Periodic Table Button (Icon/Logo on mobile, with label on desktop) */}
                                <button
                                    onClick={openPeriodicTable}
                                    className={`p-2.5 sm:px-3.5 sm:py-2.5 rounded-xl border text-sm font-bold transition-all duration-200 flex items-center space-x-2 shadow-sm active:scale-95 flex-shrink-0 ${
                                        theme === 'dark' 
                                            ? 'bg-indigo-950/40 border-indigo-800/70 text-indigo-300 hover:bg-indigo-900/60' 
                                            : 'bg-indigo-50/80 border-indigo-200 text-indigo-700 hover:bg-indigo-100'
                                    }`}
                                    title="Open Interactive Periodic Table of Elements"
                                    aria-label="Open Interactive Periodic Table"
                                >
                                    <i className="fa-solid fa-table-cells text-base text-indigo-500"></i>
                                    <span className="hidden md:inline text-sm font-bold">Periodic Table</span>
                                </button>

                                {/* 3-State Sliding Pill Theme Switcher (Eye-Care, Dark, Light) */}
                                <div 
                                    className={`relative flex items-center p-0.5 sm:p-1 rounded-full border transition-all duration-300 w-28 sm:w-36 h-9 sm:h-10 shadow-inner flex-shrink-0 ${
                                        theme === 'eyecare' 
                                            ? 'bg-slate-200/80 border-slate-300' 
                                            : theme === 'dark' 
                                                ? 'bg-slate-900/90 border-slate-700/80' 
                                                : 'bg-slate-100 border-slate-200'
                                    }`}
                                >
                                    <div 
                                        className={`absolute top-0.5 sm:top-1 bottom-0.5 sm:bottom-1 w-[30%] rounded-full shadow-md transition-all duration-300 ease-out ${
                                            theme === 'dark' 
                                                ? 'bg-gradient-to-r from-indigo-600 to-teal-600' 
                                                : 'bg-white'
                                        }`}
                                        style={{
                                            left: theme === 'eyecare' ? '3.33%' : theme === 'dark' ? '35%' : '66.66%'
                                        }}
                                    />

                                    <button 
                                        type="button"
                                        onClick={() => setTheme('eyecare')} 
                                        className="relative z-10 flex-1 h-full rounded-full flex items-center justify-center transition-colors duration-200" 
                                        title="Eye-Care Soothing Theme"
                                        aria-label="Eye-Care Mode"
                                    >
                                        <i className={`fa-solid fa-eye text-xs sm:text-sm transition-transform duration-200 ${
                                            theme === 'eyecare' ? 'text-teal-700 scale-110' : 'text-slate-500 hover:text-slate-800'
                                        }`} />
                                    </button>

                                    <button 
                                        type="button"
                                        onClick={() => setTheme('dark')} 
                                        className="relative z-10 flex-1 h-full rounded-full flex items-center justify-center transition-colors duration-200" 
                                        title="Dark Midnight Theme"
                                        aria-label="Dark Mode"
                                    >
                                        <i className={`fa-solid fa-moon text-xs sm:text-sm transition-transform duration-200 ${
                                            theme === 'dark' ? 'text-white scale-110' : 'text-slate-500 hover:text-slate-800'
                                        }`} />
                                    </button>

                                    <button 
                                        type="button"
                                        onClick={() => setTheme('light')} 
                                        className="relative z-10 flex-1 h-full rounded-full flex items-center justify-center transition-colors duration-200" 
                                        title="Clean Studio Light Theme"
                                        aria-label="Light Mode"
                                    >
                                        <i className={`fa-solid fa-sun text-xs sm:text-sm transition-transform duration-200 ${
                                            theme === 'light' ? 'text-teal-700 scale-110' : 'text-slate-500 hover:text-slate-800'

                                </div>

                                {/* Scrollable Message Thread */}
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 pt-scroll">
                                    {chatMessages.map((msg) => {
                                        const isAssistant = msg.role === 'assistant';
                                        return (
                                            <div
                                                key={msg.id}
                                                className={`flex items-start gap-2.5 ${isAssistant ? 'justify-start' : 'justify-end'}`}
                                            >
                                                {isAssistant && (
                                                    <div className="w-7 h-7 rounded-xl bg-gradient-to-tr from-teal-600 to-indigo-600 flex items-center justify-center text-white text-xs shadow-sm flex-shrink-0 mt-0.5">
                                                        <i className="fa-solid fa-robot text-[10px]"></i>
                                                    </div>
                                                )}

                                                <div className={`max-w-[85%] rounded-2xl px-4 py-3 shadow-sm ${
                                                    isAssistant
                                                        ? theme === 'dark'
                                                            ? 'bg-slate-800/90 border border-slate-700/80 text-slate-100'
                                                            : theme === 'eyecare'
                                                                ? 'bg-white border border-amber-200/80 text-stone-900 shadow-amber-950/5'
                                                                : 'bg-white border border-slate-200/90 text-slate-900'
                                                        : 'bg-gradient-to-r from-teal-600 to-cyan-600 text-white shadow-teal-600/20'
                                                }`}>
                                                    <div className="flex items-center justify-between gap-3 mb-1">
                                                        <span className={`text-[10px] font-black uppercase tracking-wider ${
                                                            isAssistant ? 'text-teal-600 dark:text-cyan-400' : 'text-teal-100'
                                                        }`}>
                                                            {isAssistant ? 'Tutor Guidance' : 'You'}
                                                        </span>
                                                        <span className={`text-[9px] ${
                                                            isAssistant ? 'text-slate-400' : 'text-teal-100/80'
                                                        }`}>
                                                            {msg.timestamp}
                                                        </span>
                                                    </div>

                                                    <div className="space-y-1">
                                                        {isAssistant ? (
                                                            renderFormattedMessage(msg.content)
                                                        ) : (
                                                            <p className="text-xs sm:text-sm leading-relaxed whitespace-pre-wrap">{cleanChemicalSymbols(msg.content)}</p>
                                                        )}
                                                    </div>
                                                </div>

                                                {!isAssistant && (
                                                    <div className="w-7 h-7 rounded-xl bg-slate-700 flex items-center justify-center text-white text-xs shadow-sm flex-shrink-0 mt-0.5">
                                                        <i className="fa-solid fa-user text-[10px]"></i>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}

                                    {/* Loading Thinking Indicator */}
                                    {chatLoading && (
                                        <div className="flex items-start gap-2.5 justify-start animate-fade-in">
                                            <div className="w-7 h-7 rounded-xl bg-gradient-to-tr from-teal-600 to-indigo-600 flex items-center justify-center text-white text-xs shadow-sm flex-shrink-0 mt-0.5">
                                                <i className="fa-solid fa-circle-notch fa-spin text-[10px]"></i>
                                            </div>
                                            <div className={`rounded-2xl px-4 py-3 shadow-sm border ${
                                                theme === 'dark' ? 'bg-slate-800/80 border-slate-700 text-slate-300' : 'bg-white border-slate-200 text-slate-600'
                                            }`}>
                                                <div className="flex items-center space-x-2">
                                                    <span className="w-2 h-2 rounded-full bg-teal-500 animate-ping"></span>
                                                    <span className="text-xs font-semibold">Formulating scientific explanation & steps...</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Error Notice */}
                                    {chatError && (
                                        <div className="p-3 rounded-2xl bg-rose-950/40 border border-rose-800/60 text-rose-200 text-xs flex items-center justify-between gap-2">
                                            <div className="flex items-center space-x-2 truncate">
                                                <i className="fa-solid fa-triangle-exclamation text-rose-400"></i>
                                                <span className="truncate">{chatError}</span>
                                            </div>
                                            <button
                                                onClick={() => handleSendChatMessage()}
                                                className="px-2.5 py-1 rounded-lg bg-rose-600 text-white font-bold text-[10px] hover:bg-rose-500 flex-shrink-0"
                                            >
                                                Retry
                                            </button>
                                        </div>
                                    )}

                                    <div ref={chatMessagesEndRef} />
                                </div>

                                {/* Suggested Diagnostic Questions / Memory Aids */}
                                <div className={`px-4 pt-2 pb-1 border-t overflow-x-auto flex gap-1.5 pt-scroll ${
                                    theme === 'dark' ? 'bg-slate-950/40 border-slate-800' : 'bg-slate-50/60 border-slate-200'
                                }`}>
                                    {[
                                        { label: "🧪 Salt Solubility (NO ANaK)", q: "Can you explain Ikmal Hafiz's 'NO ANaK' and 'Klien Papa Aku Hensem' mnemonics for salt solubility?" },
                                        { label: "⚡ Science: Electricity & Circuits", q: "Can you explain Ohm's Law (V = IR) and how voltage, current and resistance work in circuits?" },
                                        { label: "🧬 Chem: Isomers & Organic", q: "How do I systematically draw and name structural isomers for pentane and butanol in Chemistry?" },
                                        { label: "🌱 Science: Cells & Respiration", q: "What is the difference between cellular respiration and photosynthesis in secondary science?" },
                                        { label: "🔥 Chem: Redox & Oxidation States", q: "How do I calculate oxidation states and identify oxidizing agents in redox reactions?" },
                                        { label: "🪐 Science: Forces & Gravity", q: "Can you explain how gravity, mass and weight relate in secondary Science?" }
                                    ].map((item, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleSendChatMessage(item.q)}
                                            disabled={chatLoading}
                                            className={`px-2.5 py-1 rounded-xl text-[11px] font-bold whitespace-nowrap border transition-all active:scale-95 disabled:opacity-50 ${
                                                theme === 'dark'
                                                    ? 'bg-slate-800/90 hover:bg-slate-800 text-teal-300 border-slate-700'
                                                    : 'bg-white hover:bg-teal-50 text-teal-800 border-teal-200 shadow-sm'
                                            }`}
                                        >
                                            {item.label}
                                        </button>
                                    ))}
                                </div>

                                {/* Chat Input Box */}
                                <div className={`p-3 sm:p-4 border-t ${
                                    theme === 'dark' ? 'bg-slate-950/70 border-slate-800' : 'bg-white border-slate-200'
                                }`}>
                                    {/* Quick Chemical & Science Symbols Toolbar */}
                                    <div className="flex items-center space-x-1.5 mb-2 overflow-x-auto pb-1 pt-scroll text-[11px]">
                                        <span className="text-[10px] font-bold text-slate-400 mr-1 flex items-center gap-1 flex-shrink-0">
                                            <i className="fa-solid fa-atom text-teal-500"></i> Symbols:
                                        </span>
                                        {['→', '⇌', '⁺', '⁻', '²⁺', '³⁺', '₂', '₃', '₄', '₅', '₆', 'Δ', '°C', '•'].map((sym) => (
                                            <button
                                                key={sym}
                                                type="button"
                                                onClick={() => {
                                                    setChatInput(prev => prev + sym);
                                                }}
                                                className={`px-1.5 py-0.5 rounded-md font-bold text-xs border transition-all active:scale-90 flex-shrink-0 ${
                                                    theme === 'dark'
                                                        ? 'bg-slate-800 hover:bg-slate-700 text-teal-300 border-slate-700 hover:border-teal-500/50'
                                                        : 'bg-slate-100 hover:bg-teal-50 text-teal-800 border-slate-200 hover:border-teal-300'
                                                }`}
                                                title={`Insert ${sym} into message`}
                                            >
                                                {sym}
                                            </button>
                                        ))}
                                    </div>

                                    <form
                                        onSubmit={(e) => {
                                            e.preventDefault();
                                            handleSendChatMessage();
                                        }}
                                        className="flex items-center gap-2"
                                    >
                                        <div className="relative flex-1">
                                            <input
                                                type="text"
                                                value={chatInput}
                                                onChange={(e) => setChatInput(e.target.value)}
                                                placeholder={chatLoading ? "Assistant is responding..." : "Ask a question or request a diagnostic hint..."}
                                                disabled={chatLoading}
                                                className={`w-full px-4 py-2.5 text-xs sm:text-sm rounded-2xl border focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all font-medium ${
                                                    theme === 'dark'
                                                        ? 'bg-slate-800/90 border-slate-700 text-white placeholder-slate-500'
                                                        : 'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-400'
                                                }`}
                                            />
                                        </div>
                                        <button
                                            type="submit"
                                            disabled={!chatInput.trim() || chatLoading}
                                            className="h-10 w-10 sm:h-11 sm:w-11 rounded-2xl bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-700 hover:to-cyan-700 active:scale-95 text-white flex items-center justify-center shadow-md shadow-teal-600/25 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex-shrink-0"
                                            title="Send Message"
                                        >
                                            <i className="fa-solid fa-paper-plane text-xs sm:text-sm"></i>
                                        </button>
                                    </form>
                                    <div className="flex items-center justify-between mt-2 px-1 text-[10px] text-slate-400">
                                        <span className="flex items-center space-x-1">
                                            <i className="fa-solid fa-shield-halved text-teal-500"></i>
                                            <span>Facilitative tutoring • Guides towards answers</span>
                                        </span>
                                        <span className="font-semibold">DLP English & BM</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : null)}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
