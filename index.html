            useEffect(() => {
                const canvas = document.getElementById('bg-canvas');
                if (!canvas) return;
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (prefersReducedMotion) return;

                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let isPaused = document.hidden;
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const handleResize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                window.addEventListener('resize', handleResize);

                const handleVisibility = () => {
                    isPaused = document.hidden;
                    if (!isPaused) { animationFrameId = requestAnimationFrame(render); }
                };
                document.addEventListener('visibilitychange', handleVisibility);

                const numParticles = Math.min(80, Math.floor((width * height) / 24000));
                const particles = [];
                const colors = theme === 'dark' 
                    ? ['#14b8a6', '#38bdf8', '#818cf8', '#2dd4bf', '#60a5fa']
                    : theme === 'eyecare'
                    ? ['#0f766e', '#0284c7', '#4338ca', '#0d9488', '#1e40af']
                    : ['#0d9488', '#0284c7', '#6366f1', '#14b8a6', '#0284c7'];

                for (let i = 0; i < numParticles; i++) {
                    particles.push({
                        x: Math.random() * width, y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                        radius: Math.random() * 2 + 1,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    const strokeAlpha = theme === 'dark' ? 0.2 : theme === 'eyecare' ? 0.15 : 0.25;
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = theme === 'dark'
                                    ? `rgba(100, 116, 139, ${strokeAlpha * (1 - dist / 120)})`
                                    : `rgba(148, 163, 184, ${strokeAlpha * (1 - dist / 120)})`;
                                ctx.lineWidth = 0.75;
                                ctx.stroke();
                            }
                        }
                    }

                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    });

                    if (!isPaused) { animationFrameId = requestAnimationFrame(render); }
                };

                render();
                return () => {
                    window.removeEventListener('resize', handleResize);
                    document.removeEventListener('visibilitychange', handleVisibility);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [theme]);
            return null;

                    provider.setCustomParameters({ prompt: 'select_account' });

                    const result = await signInWithPopup(firebaseAuth, provider);
                    const user = result.user;

                    if (user && user.email && user.email.trim().toLowerCase() === AUTHORIZED_OWNER_EMAIL.trim().toLowerCase()) {
                        setCurrentUser(user);
                        setShowOwnerModal(false);
                        setAuthLoading(false);
                        showToast("Owner access verified via Google!", "success");
                    } else {
                        await signOut(firebaseAuth);
                        setCurrentUser(null);
                        setAuthLoading(false);
                        setAuthError(`Access Denied: ${user.email} is not authorized.`);
                    }
                } catch (error) {
                    setAuthLoading(false);
                    if (error.code === 'auth/popup-closed-by-user') {
                        setAuthError("Sign-in cancelled. Please try again.");
                    } else {
                        setAuthError(error.message || "An error occurred during Google Sign-In.");
                    }

            const handleSignOut = async () => {

            const handleSaveAvatarUrl = async () => {

                if (!isAdmin || !db || !window.FirebaseModule) return showToast('Not ready yet — please try again in a moment.', 'error');

                setAvatarSaving(true);
                try {
                    const { doc, setDoc } = window.FirebaseModule;
                    await setDoc(doc(db, 'chemtitra_config', 'profile'), {

                    setShowAvatarUrlModal(false);
                    setAvatarUrlInput('');

                    subject: getSubjectForForm(formData.form),
                    category: formData.category,
                    chapter: formData.chapter.trim() || 'General Topic',
                    title: formData.title,

                    language: formData.language || 'DLP',

                        category: formData.category,

                        title: '',
                        description: '',
                        fileUrl: '',
                        language: formData.language,
                        tags: ''

                                    <button type="button" disabled={authLoading} onClick={handleGoogleSignIn} className="w-full py-3 px-4 rounded-xl bg-[#00cba0] hover:bg-[#00b58e] active:scale-95 text-slate-950 font-extrabold text-xs flex items-center justify-center space-x-2 transition-all shadow-lg disabled:opacity-50">
                                        {authLoading ? (<><i className="fa-solid fa-circle-notch fa-spin"></i><span>Connecting to Google...</span></>) : (
                                            <><svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#08101d" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#08101d" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#08101d" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#08101d" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg><span>Continue with Google</span></>
                                        )}
                                    </button>

                                    {authError && (
                                        <div className="p-3 bg-red-950/50 border border-red-800/80 rounded-xl text-[11px] text-red-300 leading-snug">
                                            <p className="font-bold flex items-center space-x-1.5 mb-1 text-red-200"><i className="fa-solid fa-triangle-exclamation"></i><span>Sign-in Notice</span></p>
                                            <p>{authError}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Profile Photo URL Modal */}
                    {showAvatarUrlModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
                            <div className="bg-[#0b1320] border border-[#1a2638] rounded-2xl p-6 w-full max-w-md shadow-2xl text-slate-100 space-y-4 relative">
                                <div className="flex items-start justify-between">
                                    <div>
                                        <h3 className="text-xl font-bold text-white tracking-tight">Change profile photo</h3>
                                        <p className="text-xs text-slate-400 mt-0.5">Paste a link to an image already hosted online.</p>
                                    </div>
                                    <button type="button" onClick={() => { setShowAvatarUrlModal(false); setAvatarUrlInput(''); }} className="text-slate-400 hover:text-white transition-colors p-1"><i className="fa-solid fa-xmark text-base" aria-hidden="true"></i></button>
                                </div>

                                <div className="space-y-3 pt-1">
                                    <div className="w-20 h-20 mx-auto rounded-full border-2 border-[#1a2638] bg-[#08101d] overflow-hidden flex items-center justify-center">
                                        {avatarUrlInput.trim() && isLikelyImageUrl(avatarUrlInput.trim()) ? (
                                            <img src={avatarUrlInput.trim()} alt="Preview" referrerPolicy="no-referrer" className="w-full h-full object-cover" onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_AVATAR; }}/>
                                        ) : ( <i className="fa-solid fa-image text-slate-600 text-xl"></i> )}
                                    </div>

                                    <label className="block text-[11px] font-bold text-slate-400 uppercase tracking-wide">Image URL</label>
                                    <input type="url" value={avatarUrlInput} onChange={(e) => setAvatarUrlInput(e.target.value)} placeholder="Paste Profile Image URL" className="w-full bg-[#08101d] border border-[#1a2638] rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-teal-500 transition-all" />
                                    <p className="text-[10px] text-slate-500 leading-relaxed">Works with Imgur, Discord, postimages.org, or any public direct image link.</p>

                                    <div className="flex space-x-2 pt-1">
                                        <button type="button" onClick={() => { setShowAvatarUrlModal(false); setAvatarUrlInput(''); }} className="w-1/2 py-2.5 rounded-xl text-xs font-bold bg-[#08101d] border border-[#1a2638] text-slate-300 hover:bg-[#111c2e] transition-all">Cancel</button>
                                        <button type="button" disabled={avatarSaving} onClick={handleSaveAvatarUrl} className="w-1/2 py-2.5 rounded-xl text-xs font-bold bg-[#00cba0] hover:bg-[#00b58e] active:scale-95 text-slate-950 flex items-center justify-center space-x-1.5 transition-all shadow-lg disabled:opacity-50">
                                            {avatarSaving ? (<><i className="fa-solid fa-circle-notch fa-spin"></i><span>Saving...</span></>) : (<span>Save Photo</span>)}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* FLOATING AI TUTOR CHATBOT */}
                    <AIChatWidget theme={theme} />
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
