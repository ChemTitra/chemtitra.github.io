<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemTitra | Science & Chemistry Portal</title>

    <meta name="description" content="Ikmal Hafiz's educational workspace. Access curated Form 1-3 Science and Form 4-5 Chemistry notes, exam exercises and online quizzes.">

    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'], 
                    },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a' },
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS Base for Themes -->
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
        }
        /* Theme Variables & Backgrounds */
        body.theme-light { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 35%, #f0fdfa 70%, #f8fafc 100%); color: #0f172a; }
        body.theme-dark { background: linear-gradient(135deg, #0b101d 0%, #0f172a 50%, #162032 100%); color: #f8fafc; }
        body.theme-eyecare { background: linear-gradient(135deg, #f5ebd9 0%, #fcf8f2 50%, #f0e1c5 100%); color: #4a2e1b; }
        
        /* Glassmorphism Classes */
        .glass-card { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: all 0.3s ease; }
        .theme-light .glass-card { background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(203, 213, 225, 0.7); box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05); }
        .theme-dark .glass-card { background: rgba(30, 41, 59, 0.92); border: 1px solid rgba(51, 65, 85, 0.8); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .theme-eyecare .glass-card { background: rgba(252, 248, 242, 0.95); border: 1px solid rgba(232, 220, 203, 0.85); box-shadow: 0 4px 15px -3px rgba(74, 46, 27, 0.08); }
        
        /* Scrollbar styles for Chat Panel */
        .pt-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .pt-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 4px; }
        .pt-scroll::-webkit-scrollbar-thumb { background: rgba(20, 184, 166, 0.5); border-radius: 4px; }
        
        /* Animations */
        @keyframes float-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-float-up { animation: float-up 0.3s ease-out forwards; }
    </style>

    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin defer></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin defer></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" defer></script>

    <!-- Google Gen AI SDK Integration -->
    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai";
        window.GoogleAI = { GoogleGenAI };
    </script>
</head>
<body class="selection:bg-teal-500 selection:text-white theme-light">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuration & Placeholders
        const FIREBASE_CONFIG = {
            apiKey: "YOUR_GOOGLE_AI_API_KEY_HERE", // Replace with valid API Key
            projectId: "chemtitra"
        };

        const curriculumData = [ /* FILLED_IN_PHASE_2 */ ];
        const ELEMENTS = [ /* FILLED_IN_PHASE_3 */ ];

        // =========================================================================
        // TITRABOT AI CHAT WIDGET
        // =========================================================================
        const AIChatWidget = ({ theme }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [input, setInput] = useState("");
            const [isLoading, setIsLoading] = useState(false);
            const [messages, setMessages] = useState([
                { 
                    role: "model", 
                    text: "Hai! 👋 I'm TitraBot, your KSSM Science and Chemistry assistant. Need help understanding a formula or stuck on a concept? Let's figure it out together! 🧪" 
                }
            ]);
            
            const messagesEndRef = useRef(null);

            // Auto-scroll to bottom on new message
            useEffect(() => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [messages, isOpen]);

            const handleSend = async () => {
                const userText = input.trim();
                if (!userText || isLoading) return;

                // Add user message to UI immediately
                const newMessages = [...messages, { role: "user", text: userText }];
                setMessages(newMessages);
                setInput("");
                setIsLoading(true);

                try {
                    // SDK Initialization & Request Format
                    const ai = new window.GoogleAI.GoogleGenAI({ apiKey: FIREBASE_CONFIG.apiKey });
                    
                    // Format previous messages for conversational context if needed (omitted here for simple structural adherence, standard implementation below)
                    const systemInstruction = `
                        You are 'TitraBot', an expert, friendly Malaysian KSSM secondary school Science and Chemistry teacher.
                        Your characteristics:
                        1. You use appropriate emojis to make learning fun and visually engaging.
                        2. You use real-world analogies (especially related to Malaysian context like food, weather, everyday items) to explain complex chemical concepts.
                        3. You are bilingual, naturally mixing English (DLP) and Bahasa Melayu where appropriate to help students understand.
                        4. CRITICAL: You MUST use the Socratic method. Do NOT just give the final answer. Guide the student step-by-step with guiding questions to help them arrive at the answer themselves.
                    `.trim();

                    const response = await ai.models.generateContent({
                        model: "gemini-2.5-flash",
                        contents: userText,
                        config: {
                            systemInstruction: systemInstruction,
                            temperature: 0.7
                        }
                    });

                    // Add bot response to UI
                    setMessages(prev => [...prev, { role: "model", text: response.text }]);
                } catch (error) {
                    console.error("AI Generation Error:", error);
                    setMessages(prev => [...prev, { 
                        role: "model", 
                        text: "Alamak! 😅 My servers are taking a little break right now. Could you check your API configuration or try again in a moment?" 
                    }]);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            };

            // Dynamic Theme Styling Variables
            const isDark = theme === 'dark';
            const isEyecare = theme === 'eyecare';

            const panelBg = isDark ? 'bg-slate-900/95 border-slate-700' : isEyecare ? 'bg-[#fcf8f2] border-[#e8dccb]' : 'bg-white/95 border-slate-200';
            const headerBg = isDark ? 'bg-slate-800 border-slate-700' : isEyecare ? 'bg-[#f0e1c5] border-[#d4b996]' : 'bg-gradient-to-r from-teal-50 to-indigo-50 border-slate-200';
            const headerText = isDark ? 'text-white' : isEyecare ? 'text-[#4a2e1b]' : 'text-slate-800';
            
            const botBubbleBg = isDark ? 'bg-slate-800 text-slate-100 border-slate-700' : isEyecare ? 'bg-[#f5ebd9] text-[#4a2e1b] border-[#e8dccb]' : 'bg-white text-slate-900 border-slate-200';
            const userBubbleBg = 'bg-teal-600 text-white border-teal-700';
            
            const inputBg = isDark ? 'bg-slate-800 border-slate-700 text-white placeholder-slate-500' : isEyecare ? 'bg-[#f5ebd9] border-[#d4b996] text-[#4a2e1b] placeholder-[#8b6b4a]' : 'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-400';

            return (
                <div className="fixed bottom-6 right-6 z-[70] flex flex-col items-end">
                    
                    {/* Chat Panel */}
                    {isOpen && (
                        <div className={`mb-4 w-80 sm:w-[26rem] max-w-[calc(100vw-3rem)] h-[500px] max-h-[75vh] rounded-3xl flex flex-col shadow-2xl glass-card transition-all ${panelBg}`}>
                            
                            {/* Header */}
                            <div className={`flex items-center justify-between p-4 border-b rounded-t-3xl ${headerBg}`}>
                                <div className="flex items-center space-x-3">
                                    <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-teal-500 to-indigo-600 flex items-center justify-center text-white text-sm shadow-md relative">
                                        <i className="fa-solid fa-robot"></i>
                                        <span className="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full"></span>
                                    </div>
                                    <div>
                                        <h3 className={`text-sm font-bold leading-tight ${headerText}`}>TitraBot AI</h3>
                                        <p className={`text-[10px] font-semibold ${isEyecare ? 'text-[#8b6b4a]' : 'text-teal-600 dark:text-teal-400'}`}>Powered by Gemini 2.5 Flash</p>
                                    </div>
                                </div>
                                <button onClick={() => setIsOpen(false)} className={`transition-colors p-1.5 rounded-lg ${isEyecare ? 'text-[#8b6b4a] hover:bg-[#e8dccb]' : 'text-slate-400 hover:text-teal-600 hover:bg-black/5'}`}>
                                    <i className="fa-solid fa-chevron-down text-sm"></i>
                                </button>
                            </div>

                            {/* Message Feed */}
                            <div className="flex-1 p-4 overflow-y-auto space-y-4 pt-scroll text-sm flex flex-col">
                                {messages.map((msg, idx) => {
                                    const isUser = msg.role === "user";
                                    return (
                                        <div key={idx} className={`flex ${isUser ? 'justify-end' : 'justify-start'} animate-float-up`}>
                                            {!isUser && (
                                                <div className="w-6 h-6 rounded-full bg-gradient-to-tr from-teal-500 to-indigo-600 flex items-center justify-center text-white text-[10px] mr-2 mt-1 flex-shrink-0">
                                                    <i className="fa-solid fa-robot"></i>
                                                </div>
                                            )}
                                            <div className={`max-w-[80%] rounded-2xl p-3 shadow-sm whitespace-pre-wrap leading-relaxed border ${
                                                isUser 
                                                    ? `${userBubbleBg} rounded-tr-sm` 
                                                    : `${botBubbleBg} rounded-tl-sm`
                                            }`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    );
                                })}
                                
                                {/* Loading Indicator */}
                                {isLoading && (
                                    <div className="flex justify-start animate-float-up">
                                        <div className="w-6 h-6 rounded-full bg-gradient-to-tr from-teal-500 to-indigo-600 flex items-center justify-center text-white text-[10px] mr-2 mt-1 flex-shrink-0">
                                            <i className="fa-solid fa-robot"></i>
                                        </div>
                                        <div className={`rounded-2xl rounded-tl-sm p-3 shadow-sm border flex items-center space-x-1.5 ${botBubbleBg}`}>
                                            <div className="w-1.5 h-1.5 bg-teal-500 rounded-full animate-bounce"></div>
                                            <div className="w-1.5 h-1.5 bg-teal-500 rounded-full animate-bounce" style={{animationDelay: '0.15s'}}></div>
                                            <div className="w-1.5 h-1.5 bg-teal-500 rounded-full animate-bounce" style={{animationDelay: '0.3s'}}></div>
                                        </div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Input Area */}
                            <div className={`p-3 border-t rounded-b-3xl ${isDark ? 'border-slate-700 bg-slate-800/50' : isEyecare ? 'border-[#e8dccb] bg-[#f0e1c5]/30' : 'border-slate-200 bg-slate-50/50'}`}>
                                <div className="relative flex items-end">
                                    <textarea 
                                        rows="1"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={handleKeyDown}
                                        placeholder="Ask about KSSM Chemistry..." 
                                        className={`w-full pr-12 pl-4 py-3 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-teal-500 transition-all resize-none shadow-inner ${inputBg}`}
                                        style={{ minHeight: '44px', maxHeight: '100px' }}
                                    />
                                    <button 
                                        onClick={handleSend}
                                        disabled={!input.trim() || isLoading}
                                        className={`absolute right-1.5 bottom-1.5 w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-all ${
                                            input.trim() && !isLoading 
                                                ? 'bg-teal-600 text-white shadow-md hover:bg-teal-700 active:scale-95 cursor-pointer' 
                                                : `bg-slate-300 text-slate-100 cursor-not-allowed ${isDark ? 'bg-slate-700 text-slate-500' : isEyecare ? 'bg-[#d4b996] text-[#fcf8f2]' : ''}`
                                        }`}
                                    >
                                        <i className="fa-solid fa-paper-plane"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Floating Toggle Button */}
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-14 h-14 rounded-full bg-gradient-to-tr from-teal-500 to-indigo-600 shadow-[0_0_20px_rgba(20,184,166,0.5)] text-white flex items-center justify-center text-2xl hover:scale-110 active:scale-95 transition-all focus:outline-none"
                        title="TitraBot AI Tutor"
                    >
                        <i className={`fa-solid transition-transform duration-300 ${isOpen ? 'fa-xmark rotate-90' : 'fa-robot'}`}></i>
                    </button>
                </div>
            );
        };

        // =========================================================================
        // MAIN APPLICATION COMPONENT
        // =========================================================================
        const App = () => {
            const [theme, setTheme] = useState('light'); // Switch between 'light', 'dark', 'eyecare'

            // Apply body classes for global CSS variables/backgrounds
            useEffect(() => {
                document.body.className = `theme-${theme} selection:bg-teal-500 selection:text-white`;
            }, [theme]);

            return (
                <div className="min-h-screen relative z-10 flex flex-col font-sans">
                    
                    {/* Demo Header for Theme Switching Context */}
                    <header className={`p-4 border-b flex justify-between items-center ${
                        theme === 'dark' ? 'bg-slate-900 border-slate-800 text-white' : 
                        theme === 'eyecare' ? 'bg-[#f0e1c5] border-[#d4b996] text-[#4a2e1b]' : 
                        'bg-white border-slate-200 text-slate-800'
                    }`}>
                        <h1 className="text-xl font-bold font-display tracking-wide">
                            <i className="fa-solid fa-flask text-teal-600 mr-2"></i>ChemTitra
                        </h1>
                        <div className="flex gap-2">
                            <button onClick={() => setTheme('light')} className="px-3 py-1 rounded text-xs font-bold border border-slate-300 bg-white text-slate-700">Light</button>
                            <button onClick={() => setTheme('dark')} className="px-3 py-1 rounded text-xs font-bold border border-slate-700 bg-slate-800 text-white">Dark</button>
                            <button onClick={() => setTheme('eyecare')} className="px-3 py-1 rounded text-xs font-bold border border-[#d4b996] bg-[#f5ebd9] text-[#4a2e1b]">Eye-Care</button>
                        </div>
                    </header>

                    <main className="flex-grow p-6 flex items-center justify-center">
                        <div className="text-center opacity-70">
                            <i className="fa-solid fa-layer-group text-4xl mb-4"></i>
                            <p className="text-sm font-semibold uppercase tracking-widest">Portal Core Engine Active</p>
                        </div>
                    </main>

                    {/* Integrated AI Tutor Widget */}
                    <AIChatWidget theme={theme} />

                    {/* FILLED_IN_PHASE_4 */}
                </div>
            );
        };

        // Render Application
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
