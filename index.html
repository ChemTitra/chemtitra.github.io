    const formatEmbedUrl = (rawUrl) => {
        if (!rawUrl) return '';
        let url = rawUrl.trim();
        const driveFileMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (driveFileMatch && driveFileMatch[1]) { return `https://drive.google.com/file/d/${driveFileMatch[1]}/preview`; }
        return url;
    };

    const isRecentlyUploaded = (dateString) => {
        if (!dateString) return false;
        const diffDays = Math.ceil(Math.abs(new Date() - new Date(dateString)) / (1000 * 60 * 60 * 24));
        return diffDays <= 7;
    };

    const MolecularCanvas = ({ theme }) => {
        useEffect(() => {
            const canvas = document.getElementById('bg-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            let particles = [];

            const colors = theme === 'dark' ? ['#1e293b', '#0f172a', '#14b8a6'] : ['#e2e8f0', '#cbd5e1', '#14b8a6'];

            for(let i=0; i<60; i++) {
                particles.push({
                    x: Math.random()*width, y: Math.random()*height,
                    vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2,
                    r: Math.random()*2+1, color: colors[Math.floor(Math.random()*colors.length)]
                });
            }

            const draw = () => {
                ctx.clearRect(0,0,width,height);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x<0 || p.x>width) p.vx*=-1;
                    if(p.y<0 || p.y>height) p.vy*=-1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            };
            draw();
        }, [theme]);
        return null;
    };

        const [firebaseAuth, setFirebaseAuth] = useState(null);
        const [db, setDb] = useState(null);
        const [avatarUrl, setAvatarUrl] = useState(PERMANENT_AVATAR_URL);
        const [announcement, setAnnouncement] = useState('📢 Welcome to ChemTitra! Explore curated KSSM notes and exercises.');

        const [editingItem, setEditingItem] = useState(null);
        const [activePdfItem, setActivePdfItem] = useState(null);
        const [itemToDelete, setItemToDelete] = useState(null);
        const [showOwnerModal, setShowOwnerModal] = useState(false);
        const [authLoading, setAuthLoading] = useState(false);
        const [formData, setFormData] = useState({ form: 'Form 4', subject: 'Chemistry', category: 'Notes', chapter: '', title: '', description: '', fileUrl: '', language: 'DLP', tags: '' });

        const isAdmin = useMemo(() => currentUser?.email?.toLowerCase() === AUTHORIZED_OWNER_EMAIL, [currentUser]);

        useEffect(() => {
            document.body.className = 'theme-' + theme;
        }, [theme]);

        useEffect(() => {
            if (selectedCategory === 'Quiz') {
                renderProgressMap(theme, selectedForm, (selectedForm === 'Form 4' || selectedForm === 'Form 5') ? 'Chemistry' : 'Science');
            }
        }, [selectedCategory, theme, selectedForm]);

        useEffect(() => {
            if (!window.FirebaseModule) return;
            const { initializeApp, getAuth, onAuthStateChanged, getFirestore, collection, doc, onSnapshot } = window.FirebaseModule;
            const app = initializeApp(FIREBASE_CONFIG);
            const authInst = getAuth(app);
            const dbInst = getFirestore(app);
            setFirebaseAuth(authInst);
            setDb(dbInst);

            onAuthStateChanged(authInst, (user) => setCurrentUser(user?.email === AUTHORIZED_OWNER_EMAIL ? user : null));
            onSnapshot(collection(dbInst, 'chemtitra_materials'), (snap) => setMaterials(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
            onSnapshot(doc(dbInst, 'chemtitra_config', 'profile'), (snap) => snap.exists() && setAvatarUrl(snap.data().avatarUrl));
        }, []);

        const handleGoogleSignIn = async () => {
            setAuthLoading(true);
            const { signInWithPopup, GoogleAuthProvider } = window.FirebaseModule;
            try {
                await signInWithPopup(firebaseAuth, new GoogleAuthProvider());
                setShowOwnerModal(false);
            } catch (e) { alert("Auth failed: " + e.message); }
            setAuthLoading(false);
        };

        const handleSaveMaterial = async (e) => {
            e.preventDefault();
            const { doc, setDoc, addDoc, collection } = window.FirebaseModule;
            const finalData = { ...formData, updatedAt: new Date().toISOString(), tags: formData.tags.split(',').map(t=>t.trim()) };
            if (editingItem) await setDoc(doc(db, 'chemtitra_materials', editingItem.id), finalData, { merge: true });
            else await addDoc(collection(db, 'chemtitra_materials'), finalData);
            setShowMaterialModal(false);
        };

            return materials.filter(m => m.form === selectedForm && m.category === selectedCategory && (filterLanguage === 'ALL' || m.language === filterLanguage))
                            .filter(m => !searchQuery || m.title.toLowerCase().includes(searchQuery.toLowerCase()))
                            .sort((a,b) => sortBy === 'newest' ? b.updatedAt.localeCompare(a.updatedAt) : a.title.localeCompare(b.title));
        }, [materials, selectedForm, selectedCategory, filterLanguage, searchQuery, sortBy]);

        const markComplete = (id) => {
            const updated = [...new Set([...completedMaterials, id])];
            setCompletedMaterials(updated);
            localStorage.setItem('chemtitra_completed_materials', JSON.stringify(updated));

                    {/* Instructor Profile Card */}

                                        <h3 className="text-sm font-black text-slate-950 leading-none mb-1">{activePdfItem.title}</h3>

                                <div className="flex gap-2">
                                    <a href={activePdfItem.fileUrl} target="_blank" className="px-5 py-2.5 rounded-xl bg-slate-950 text-white font-bold text-xs">Open External</a>

                            <iframe src={activePdfItem.fileUrl} className="flex-1 w-full border-0 bg-slate-50" loading="lazy"></iframe>

                {showPeriodicTable && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/90 backdrop-blur-xl p-4 animate-fade-in">
                        <div className={`w-full max-w-7xl h-[90vh] rounded-[3rem] flex flex-col border shadow-2xl overflow-hidden ${theme === 'dark' ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-white'}`}>

                                    <div className="w-12 h-12 rounded-[1.5rem] bg-indigo-600 flex items-center justify-center text-white"><i className="fa-solid fa-table-cells"></i></div>
                                    <div>
                                        <h2 className="text-2xl font-black">Periodic Table of Elements</h2>
                                        <p className="text-xs font-bold opacity-40 uppercase tracking-widest">Interactive Database</p>

                                <div className="flex gap-4 pt-4">
                                    <button type="button" onClick={() => setShowMaterialModal(false)} className="flex-1 py-4 rounded-2xl border font-bold text-sm">Cancel</button>
                                    <button type="submit" className="flex-1 py-4 rounded-2xl bg-brand-600 text-white font-bold text-sm">Save Module</button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}

                {/* Owner Modal */}
                {showOwnerModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                        <div className="w-full max-w-sm rounded-[2.5rem] p-8 glass-card border border-white/10 text-center">
                            <div className="w-16 h-16 rounded-[1.5rem] bg-brand-600 text-white flex items-center justify-center text-2xl mx-auto mb-6"><i className="fa-solid fa-shield-halved"></i></div>
                            <h3 className="text-2xl font-black mb-2 text-white">Owner Access</h3>
                            <p className="text-sm opacity-60 mb-8 text-white">Authorized educator login required to modify workspace content.</p>
                            <button onClick={handleGoogleSignIn} disabled={authLoading} className="w-full py-4 rounded-2xl bg-white text-slate-950 font-black text-sm flex items-center justify-center gap-3 transition-all active:scale-95">
                                {authLoading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <><i className="fa-brands fa-google"></i> Sign in with Google</>}
                            </button>
                            <button onClick={() => setShowOwnerModal(false)} className="mt-4 text-xs font-bold text-white/40 uppercase tracking-widest">Back to Guest View</button>
                        </div>
                    </div>
                )}
                
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
