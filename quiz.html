<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemTitra | Neural Progress Map</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Futuristic Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Futuristic Theme */
        body {
            background-color: #050b14;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(13, 148, 136, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(79, 70, 229, 0.05), transparent 25%);
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Node Animations & Neon Glows */
        .neon-green-glow {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6), inset 0 0 10px rgba(34, 197, 94, 0.4);
            border-color: #22c55e;
            color: #22c55e;
        }
        
        .neon-blue-glow {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6), inset 0 0 10px rgba(56, 189, 248, 0.4);
            border-color: #38bdf8;
            color: #38bdf8;
            animation: neon-pulse 2s infinite ease-in-out;
        }

        @keyframes neon-pulse {
            0% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.5), inset 0 0 5px rgba(56, 189, 248, 0.3); }
            50% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.9), inset 0 0 15px rgba(56, 189, 248, 0.6); transform: scale(1.05) translateX(-50%); }
            100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.5), inset 0 0 5px rgba(56, 189, 248, 0.3); }
        }

        /* Specifically target the mobile translation for the pulse animation so it doesn't break alignment */
        @media (max-width: 767px) {
            .neon-blue-glow {
                animation: neon-pulse-mobile 2s infinite ease-in-out;
            }
            @keyframes neon-pulse-mobile {
                0% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.5), inset 0 0 5px rgba(56, 189, 248, 0.3); }
                50% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.9), inset 0 0 15px rgba(56, 189, 248, 0.6); transform: scale(1.05); }
                100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.5), inset 0 0 5px rgba(56, 189, 248, 0.3); }
            }
        }

        /* Locked State styling */
        .node-locked {
            border-color: #334155;
            background-color: #0f172a;
            color: #64748b;
        }

        /* Connecting Lines */
        .path-line {
            transition: all 0.5s ease;
        }
        .path-completed {
            background: linear-gradient(to bottom, #22c55e, #16a34a);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
        }
        .path-locked {
            background-color: #1e293b;
        }
    </style>
</head>
<body class="antialiased selection:bg-teal-500 selection:text-white pb-20">

    <div class="max-w-5xl mx-auto pt-16 px-4 sm:px-6 lg:px-8">
        
        <!-- Header -->
        <header class="text-center mb-16 relative">
            <div class="inline-block p-3 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl mb-4">
                <i class="fa-solid fa-atom text-4xl text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500 animate-spin-slow"></i>
            </div>
            <h1 class="font-display text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-400 via-cyan-400 to-blue-500 drop-shadow-lg tracking-wider mb-2">
                ChemTitra Nodes
            </h1>
            <p class="text-slate-400 text-lg font-semibold tracking-widest uppercase">Neural Syllabus Uplink</p>
        </header>

        <!-- Dynamic Timeline Container -->
        <div id="progress-map" class="relative w-full py-8">
            <!-- JavaScript will inject the nodes here -->
        </div>

    </div>

    <!-- JavaScript Data & Render Engine -->
    <script>
        // 1. MOCK DATA STRUCTURE
        // Easily add, remove, or reorder topics here. The UI will automatically adapt.
        const curriculumData = [
            { 
                id: "01", 
                title: "Matter & Atomic Structure", 
                description: "Fundamental particles, isotopes, and atomic models.",
                status: "completed", 
                quizUrl: "/quiz/topic-1" 
            },
            { 
                id: "02", 
                title: "Periodic Table of Elements", 
                description: "Group trends, valency, and electron configurations.",
                status: "completed", 
                quizUrl: "/quiz/topic-2" 
            },
            { 
                id: "03", 
                title: "Chemical Formulae & Equations", 
                description: "The mole concept, molar mass, and balancing equations.",
                status: "available", 
                quizUrl: "/quiz/topic-3" 
            },
            { 
                id: "04", 
                title: "Acids, Bases and Salts", 
                description: "pH values, neutralization, and solubility rules.",
                status: "locked", 
                quizUrl: null 
            },
            { 
                id: "05", 
                title: "Rate of Reaction", 
                description: "Collision theory, catalysts, and activation energy.",
                status: "locked", 
                quizUrl: null 
            },
            { 
                id: "06", 
                title: "Carbon Compounds", 
                description: "Alkanes, alkenes, alcohols, and polymer chains.",
                status: "locked", 
                quizUrl: null 
            }
        ];

        // 2. INTERACTION HANDLER
        function handleNodeClick(topicId) {
            const topic = curriculumData.find(t => t.id === topicId);
            
            if (topic.status === "locked") {
                return; // Do nothing if locked
            }

            if (topic.status === "completed") {
                alert(`Re-accessing completed data logs for [Module ${topic.id}: ${topic.title}]. Review mode activated.`);
                // Window.location.href = topic.quizUrl;
            } else if (topic.status === "available") {
                alert(`Initiating new quiz sequence for [Module ${topic.id}: ${topic.title}]. Good luck!`);
                // Window.location.href = topic.quizUrl;
            }
        }

        // 3. DYNAMIC RENDERING ENGINE
        function renderProgressMap() {
            const container = document.getElementById('progress-map');
            container.innerHTML = ''; // Clear container

            // Build the core central track line (Background line)
            const trackLine = document.createElement('div');
            trackLine.className = 'absolute left-8 md:left-1/2 top-0 bottom-0 w-1 bg-slate-800 transform md:-translate-x-1/2 rounded-full z-0';
            container.appendChild(trackLine);

            // Loop through data and generate nodes
            curriculumData.forEach((node, index) => {
                const isEven = index % 2 === 0; // Determines left/right layout on Desktop
                const isLast = index === curriculumData.length - 1;

                // State Variable setup
                let nodeClasses, borderClasses, textClasses, iconClasses, cursorClasses;

                if (node.status === 'completed') {
                    nodeClasses = 'neon-green-glow bg-slate-900';
                    borderClasses = 'border-green-500/50 hover:border-green-400 bg-gradient-to-br from-slate-900 to-green-900/20';
                    textClasses = 'text-green-400';
                    iconClasses = 'fa-check';
                    cursorClasses = 'cursor-pointer hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(34,197,94,0.15)]';
                } else if (node.status === 'available') {
                    nodeClasses = 'neon-blue-glow bg-[#050b14]';
                    borderClasses = 'border-sky-500/80 bg-gradient-to-br from-slate-900 to-sky-900/30 ring-1 ring-sky-500 shadow-[0_0_20px_rgba(14,165,233,0.15)]';
                    textClasses = 'text-sky-400 font-bold';
                    iconClasses = 'fa-unlock text-sky-400';
                    cursorClasses = 'cursor-pointer hover:-translate-y-1 hover:shadow-[0_10px_25px_rgba(56,189,248,0.25)]';
                } else {
                    nodeClasses = 'node-locked';
                    borderClasses = 'border-slate-800/80 bg-slate-900/40 opacity-70';
                    textClasses = 'text-slate-500';
                    iconClasses = 'fa-lock text-slate-600';
                    cursorClasses = 'cursor-not-allowed';
                }

                // Create Item Wrapper
                const itemWrapper = document.createElement('div');
                itemWrapper.className = `relative z-10 flex items-center mb-16 w-full ${isEven ? 'md:flex-row-reverse' : ''} group`;

                // Calculate glowing connecting line to the next node
                let pathSegmentHTML = '';
                if (!isLast) {
                    const isNextNodeUnlocked = curriculumData[index + 1].status !== 'locked';
                    const isThisCompleted = node.status === 'completed';
                    
                    // The line glowing green means this node is passed, bridging to the next.
                    const lineStateClass = isThisCompleted ? 'path-completed' : 'path-locked';
                    
                    // Absolute line stretching down from current node to next node
                    pathSegmentHTML = `<div class="absolute left-8 md:left-1/2 transform md:-translate-x-1/2 w-1 h-[calc(100%+4rem)] top-6 -z-10 ${lineStateClass} path-line"></div>`;
                }

                // Construct HTML for the individual Node
                itemWrapper.innerHTML = `
                    ${pathSegmentHTML}

                    <!-- Desktop spacer to force left/right alignment -->
                    <div class="hidden md:block w-1/2"></div>
                    
                    <!-- Circular Map Node -->
                    <div class="absolute left-8 md:left-1/2 transform -translate-x-1/2 md:-translate-x-1/2 flex items-center justify-center w-14 h-14 rounded-full border-2 transition-all duration-500 z-20 ${nodeClasses}">
                        <i class="fa-solid ${iconClasses} text-xl"></i>
                    </div>
                    
                    <!-- Topic Detail Card -->
                    <div class="w-full pl-24 md:pl-0 md:w-1/2 flex ${isEven ? 'md:pr-16 md:justify-end' : 'md:pl-16 md:justify-start'}">
                        <div class="w-full max-w-md p-6 rounded-2xl border glass-panel transition-all duration-300 ${borderClasses} ${cursorClasses}" 
                             onclick="handleNodeClick('${node.id}')">
                            
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-display text-[11px] uppercase tracking-[0.2em] ${textClasses}">Module ${node.id}</span>
                                ${node.status === 'available' ? `<span class="flex items-center gap-1.5 text-[10px] font-bold text-sky-400 bg-sky-950/50 px-2 py-1 rounded-md border border-sky-800/50 animate-pulse"><i class="fa-solid fa-satellite-dish"></i> ACTIVE</span>` : ''}
                                ${node.status === 'completed' ? `<span class="flex items-center gap-1.5 text-[10px] font-bold text-green-400 bg-green-950/50 px-2 py-1 rounded-md border border-green-800/50"><i class="fa-solid fa-check-double"></i> CLEARED</span>` : ''}
                            </div>
                            
                            <h2 class="text-xl md:text-2xl font-bold text-white mb-2 leading-tight">${node.title}</h2>
                            <p class="text-sm ${node.status === 'locked' ? 'text-slate-600' : 'text-slate-400'}">${node.description}</p>
                            
                            ${node.status !== 'locked' ? `
                                <div class="mt-4 pt-4 border-t ${node.status === 'completed' ? 'border-green-900/30' : 'border-sky-900/30'} flex items-center justify-between">
                                    <span class="text-xs font-semibold ${textClasses}">
                                        ${node.status === 'completed' ? 'Review Archives' : 'Initialize Quiz Sequence'}
                                    </span>
                                    <i class="fa-solid fa-arrow-right ${textClasses} group-hover:translate-x-1 transition-transform"></i>
                                </div>
                            ` : ''}

                        </div>
                    </div>
                `;

                container.appendChild(itemWrapper);
            });
        }

        // Initialize Rendering when DOM is loaded
        document.addEventListener('DOMContentLoaded', renderProgressMap);

    </script>
</body>
</html>
